<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Bricolage Grotesque',sans-serif;
background:radial-gradient(circle at 20% 15%,#ffd6c9 0,transparent 45%),radial-gradient(circle at 85% 80%,#ffc2dc 0,transparent 45%),linear-gradient(160deg,#fff4ea,#ffe3ec 60%,#ffd9cc);position:relative}
.logo{position:absolute;top:50px;left:50px;width:150px;height:150px;border-radius:50%;border:7px solid #fff;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.logo img{width:100%;height:100%;object-fit:cover}
.hook{position:absolute;top:240px;left:70px;right:70px;text-align:center}
.hook .fr{font-size:64px;font-weight:800;line-height:1.05;color:#2b1d3a}
.hook .fr b{color:#e8457a}
.hook .it{margin-top:18px;font-size:38px;font-weight:500;color:#7b5a72;font-style:italic}
.phone{position:absolute;left:190px;top:620px;width:700px;height:1250px;border-radius:96px;background:#141218;padding:22px;box-shadow:0 40px 90px rgba(80,20,60,.35),inset 0 0 0 3px #3a3540}
.screen{width:100%;height:100%;border-radius:76px;overflow:hidden;background:#efe7de;position:relative;
background-image:radial-gradient(#e1d6c9 2px,transparent 2px);background-size:34px 34px}
.island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:200px;height:56px;border-radius:30px;background:#000;z-index:3}
.status{position:absolute;top:28px;left:60px;right:60px;display:flex;justify-content:space-between;font-size:30px;font-weight:700;color:#fff;z-index:2}
.top{background:#1f7a63;height:220px;padding:110px 30px 0;display:flex;align-items:center;gap:22px;color:#fff}
.av{width:86px;height:86px;border-radius:50%;background:#ffd9a8;display:flex;align-items:center;justify-content:center;font-size:52px}
.top .n{font-size:40px;font-weight:700}.top .s{font-size:26px;opacity:.85}
.day{margin:40px auto 0;width:max-content;background:#dfeef3;color:#4a5b63;font-size:24px;padding:8px 20px;border-radius:14px}
.bub{position:absolute;left:34px;top:420px;width:540px;background:#fff;border-radius:34px 34px 34px 8px;padding:26px 26px 18px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.row{display:flex;align-items:center;gap:20px}
.play{width:92px;height:92px;border-radius:50%;background:#1f7a63;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 0 rgba(31,122,99,.5)}
.play:after{content:"";border-left:34px solid #fff;border-top:21px solid transparent;border-bottom:21px solid transparent;margin-left:8px}
.wave{display:flex;align-items:center;gap:7px;height:80px;flex:1}
.wave i{width:8px;border-radius:4px;background:#b7c7c2}
.meta{display:flex;justify-content:space-between;font-size:24px;color:#8a9592;margin-top:8px;padding-left:112px}
.av2{position:absolute;left:470px;top:-30px;width:64px;height:64px;border-radius:50%;background:#ffd9a8;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:34px}
.hand{position:absolute;left:62px;top:478px;font-size:150px;transform:rotate(-20deg);filter:drop-shadow(0 12px 14px rgba(0,0,0,.3));z-index:5}
.ring{position:absolute;left:36px;top:421px;width:140px;height:140px;border-radius:50%;border:6px solid rgba(232,69,122,.7);z-index:4}
.input{position:absolute;left:24px;right:24px;bottom:40px;height:96px;border-radius:50px;background:#fff;display:flex;align-items:center;padding:0 30px;font-size:30px;color:#9aa}
.notif{position:absolute;left:90px;right:90px;top:690px;}
</style></head><body>
<div class="logo"><img src="logo.png"></div>
<div class="hook"><div class="fr">Votre <b>belle-mère</b> française vous a laissé un vocal…</div><div class="it">La vostra suocera francese vi ha lasciato un vocale…</div></div>
<div class="phone"><div class="screen">
<div class="island"></div><div class="status"><span>12:07</span><span>●●● 🔋</span></div>
<div class="top"><span style="font-size:44px">‹</span><div class="av">👵</div><div><div class="n">Belle-maman</div><div class="s">en ligne</div></div></div>
<div class="day">Aujourd'hui</div>
<div class="bub"><div class="av2">👵</div><div class="row"><div class="play"></div><div class="wave"><i style="height:44px"></i><i style="height:30px"></i><i style="height:61px"></i><i style="height:74px"></i><i style="height:22px"></i><i style="height:15px"></i><i style="height:74px"></i><i style="height:47px"></i><i style="height:43px"></i><i style="height:38px"></i><i style="height:74px"></i><i style="height:74px"></i><i style="height:64px"></i><i style="height:33px"></i><i style="height:43px"></i><i style="height:33px"></i><i style="height:63px"></i><i style="height:15px"></i><i style="height:22px"></i><i style="height:34px"></i><i style="height:19px"></i><i style="height:52px"></i><i style="height:17px"></i><i style="height:48px"></i><i style="height:74px"></i><i style="height:63px"></i></div></div><div class="meta"><span>0:18</span><span>12:06</span></div></div>
<div class="ring"></div><div class="hand">👆</div>
<div class="input">Message</div>
</div></div>
</body></html>
