<script>
const D = {"modules": [{"id": "m1", "num": 1, "img": "m1.jpg", "title": "Choisis ton programme !", "title_en": "Choose your programme!", "color": "#e2557b", "color2": "#f39a5b", "points": ["p1", "p2", "p3"]}, {"id": "m2", "num": 2, "img": "m2.jpg", "title": "Comprends ta famille !", "title_en": "Understand your family!", "color": "#f08a24", "color2": "#f6c445", "points": ["p4", "p5", "p6", "p7"]}, {"id": "m3", "num": 3, "img": "m3.jpg", "title": "Exprime tes talents !", "title_en": "Express your talents!", "color": "#6c4ee0", "color2": "#b07cf2", "points": ["p8", "p9", "p10", "p11"]}, {"id": "m4", "num": 4, "img": "m4.jpg", "title": "Plonge-toi dans la lecture !", "title_en": "Dive into reading!", "color": "#2e9e6a", "color2": "#8fd16a", "points": ["p12", "p13"]}, {"id": "m5", "num": 5, "img": "m5.jpg", "title": "Prépare ton avenir !", "title_en": "Prepare your future!", "color": "#d9433b", "color2": "#f07b5e", "points": ["p14", "p15", "p16"]}, {"id": "m6", "num": 6, "img": "m6.jpg", "title": "Imagine le monde de demain !", "title_en": "Imagine tomorrow's world!", "color": "#1f78c8", "color2": "#3fc1d9", "points": ["p17", "p18", "p19", "p20"]}], "points": {"p1": {"title": "La formation des adjectifs", "title_en": "How some adjectives are formed", "rule": [["Certains adjectifs se forment à partir d'un **verbe**. Ils veulent dire « **qui fait l'action de…** ».", "Some adjectives are formed from a **verb**. They mean \"**which does the action of…**\"."], ["Suffixes : **-ant(e)** · **-if / -ive** · **-atif / -ative** · **-ateur / -atrice** · **-eux / -euse**", "Suffixes: -ant(e) · -if / -ive · -atif / -ative · -ateur / -atrice · -eux / -euse"], ["Comme tous les adjectifs, ils s'**accordent** en genre et en nombre avec le nom.", "Like all adjectives, they **agree** in gender and number with the noun."]], "table": {"head": ["Verbe · Verb", "Adjectif · Adjective", "= qui…"], "rows": [["amuser", "amusant / amusante", "qui amuse"], ["instruire", "instructif / instructive", "qui instruit"], ["informer", "informatif / informative", "qui informe"], ["créer", "créateur / créatrice", "qui crée"], ["ennuyer", "ennuyeux / ennuyeuse", "qui ennuie"]]}, "box": {"title": "Attention · Watch out", "lines": [["Quelques adjectifs changent un peu : fatiguer → **fatigant**, provoquer → **provocant**.", "A few adjectives change slightly: fatiguer → fatigant (no -u-), provoquer → provocant (c, not qu)."]]}, "ex": [["Cette exposition est **passionnante**.", "This exhibition is fascinating.", "ae99e0a5772"], ["Le documentaire sur les volcans est très **instructif**.", "The documentary about volcanoes is very instructive.", "a1cd98f6370"], ["Les longues visites guidées sont parfois **ennuyeuses**.", "Long guided tours are sometimes boring.", "a625cc5fa37"], ["Une œuvre **provocante** fait toujours réagir le public.", "A provocative work always makes the public react.", "a5688934c83"]], "exercises": [{"type": "fill", "title": "Le bon adjectif", "title_en": "The right adjective", "c": "Lilac, forme l'adjectif à partir du verbe entre parenthèses. N'oublie pas l'accord !", "c_en": "Lilac, form the adjective from the verb in brackets. Don't forget the agreement!", "items": [{"q": "Cette sculpture en métal est vraiment ___ !", "hint": "étonner", "a": ["étonnante"], "en": "This metal sculpture is really surprising!", "id": "p1e1i1", "full": "Cette sculpture en métal est vraiment étonnante !", "audio": "af29addb270"}, {"q": "Les vidéos de science sur Internet sont souvent très ___ .", "hint": "instruire", "a": ["instructives"], "en": "Science videos on the Internet are often very instructive.", "id": "p1e1i2", "full": "Les vidéos de science sur Internet sont souvent très instructives.", "audio": "a20ae952a96"}, {"q": "Ma cousine trouve la peinture abstraite ___ .", "hint": "ennuyer", "a": ["ennuyeuse"], "en": "My cousin finds abstract painting boring.", "id": "p1e1i3", "full": "Ma cousine trouve la peinture abstraite ennuyeuse.", "audio": "a0ef2a4170c"}, {"q": "Une journée entière au musée, c'est ___ !", "hint": "fatiguer", "a": ["fatigant"], "en": "A whole day at the museum is tiring!", "why": "Après « c'est », l'adjectif reste au masculin. Et attention : fatigant, sans u ! · After \"c'est\", the adjective stays masculine. And careful: fatigant, without u!", "id": "p1e1i4", "full": "Une journée entière au musée, c'est fatigant !", "audio": "a6d1f674aa9"}, {"q": "Ce jeu ___ aide les enfants à comprendre les planètes.", "hint": "éduquer", "a": ["éducatif"], "en": "This educational game helps children understand the planets.", "id": "p1e1i5", "full": "Ce jeu éducatif aide les enfants à comprendre les planètes.", "audio": "a19e89c144d"}, {"q": "Le peintre a fait des affiches très ___ contre la guerre.", "hint": "provoquer", "a": ["provocantes"], "en": "The painter made very provocative posters against war.", "id": "p1e1i6", "full": "Le peintre a fait des affiches très provocantes contre la guerre.", "audio": "aa9806856e5"}], "id": "p1e1"}, {"type": "match", "title": "Adjectif = qui…", "title_en": "Adjective = which…", "c": "Lilac, associe chaque adjectif à sa définition. Touche un adjectif, puis sa définition.", "c_en": "Lilac, match each adjective with its definition. Tap an adjective, then its definition.", "pairs": [["créatif", "qui crée"], ["amusant", "qui amuse"], ["informatif", "qui informe"], ["ennuyeux", "qui ennuie"], ["inspirant", "qui inspire"], ["manipulateur", "qui manipule"]], "id": "p1e2", "rorder": [3, 1, 5, 4, 0, 2]}], "id": "p1"}, "p2": {"title": "Le passé composé et l'imparfait", "title_en": "The passé composé and the imparfait", "img": "x5.jpg", "rule": [["**Passé composé** : une action **terminée**, un **événement** précis, une suite d'actions.", "**Passé composé**: a **finished** action, a specific **event**, a sequence of actions."], ["**Imparfait** : une **description** (le décor), une **habitude** passée, une action **en cours** (non terminée).", "**Imparfait**: a **description** (the setting), a past **habit**, an action **in progress** (not finished)."], ["Souvent, les deux temps sont ensemble : l'imparfait pose le décor, le passé composé raconte l'événement.", "The two tenses often work together: the imparfait sets the scene, the passé composé tells the event."]], "formula": ["imparfait (décor) + quand + passé composé (événement)", "imperfect (setting) + when + passé composé (event)"], "ex": [["Quand j'**étais** petite, je **dessinais** tous les jours.", "When I was little, I used to draw every day. (habit)", "a1a9d7e7555"], ["Le musée **était** silencieux et il **faisait** froid.", "The museum was silent and it was cold. (description)", "aaac2380862"], ["Je **regardais** un tableau de Monet quand mon téléphone **a sonné**.", "I was looking at a painting by Monet when my phone rang.", "ac97cc9cf1b"], ["Hier, nous **avons visité** le Centre Pompidou et nous **avons acheté** un livre d'art.", "Yesterday we visited the Centre Pompidou and we bought an art book.", "a2ac6ed29e4"]], "exercises": [{"type": "choose", "title": "Une visite au musée d'Orsay", "title_en": "A visit to the Musée d'Orsay", "c": "Lilac, lis l'histoire et choisis le bon temps pour chaque verbe.", "c_en": "Lilac, read the story and choose the right tense for each verb.", "items": [{"q": "Samedi dernier, il ___ très beau.", "opts": ["a fait", "faisait"], "a": [1], "en": "Last Saturday, the weather was very nice.", "id": "p2e1i1", "full": "Samedi dernier, il faisait très beau.", "audio": "a735367e4c4"}, {"q": "Alors, je ___ au musée d'Orsay avec ma mère.", "opts": ["suis allée", "allais"], "a": [0], "en": "So I went to the Musée d'Orsay with my mother.", "id": "p2e1i2", "full": "Alors, je suis allée au musée d'Orsay avec ma mère.", "audio": "a967f54b429"}, {"q": "Il y ___ beaucoup de touristes dans les salles.", "opts": ["a eu", "avait"], "a": [1], "en": "There were a lot of tourists in the rooms.", "id": "p2e1i3", "full": "Il y avait beaucoup de touristes dans les salles.", "audio": "a564633b5c3"}, {"q": "Pendant que je ___ un autoportrait de Van Gogh…", "opts": ["regardais", "ai regardé"], "a": [0], "en": "While I was looking at a self-portrait by Van Gogh…", "id": "p2e1i4", "full": "Pendant que je regardais un autoportrait de Van Gogh…", "audio": "a37e8929d90"}, {"q": "… un petit garçon ___ à pleurer très fort !", "opts": ["commençait", "a commencé"], "a": [1], "en": "… a little boy started crying very loudly!", "id": "p2e1i5", "full": "… un petit garçon a commencé à pleurer très fort !", "audio": "a7ce5a1f4e2"}, {"q": "Avant, je ___ les musées ennuyeux, mais maintenant je les adore.", "opts": ["ai trouvé", "trouvais"], "a": [1], "en": "Before, I used to find museums boring, but now I love them.", "id": "p2e1i6", "full": "Avant, je trouvais les musées ennuyeux, mais maintenant je les adore.", "audio": "a76d61461cd"}], "id": "p2e1"}, {"type": "fill", "title": "Artistes et scientifiques", "title_en": "Artists and scientists", "c": "Lilac, conjugue le verbe au passé composé ou à l'imparfait.", "c_en": "Lilac, conjugate the verb in the passé composé or the imparfait.", "items": [{"q": "Autrefois, Rodin ___ dans un grand atelier à Meudon.", "hint": "travailler", "a": ["travaillait"], "en": "In the past, Rodin worked in a big studio in Meudon. (habit)", "id": "p2e2i1", "full": "Autrefois, Rodin travaillait dans un grand atelier à Meudon.", "audio": "a897feb4192"}, {"q": "En 1898, Marie Curie ___ le radium avec Pierre Curie.", "hint": "découvrir", "a": ["a découvert"], "en": "In 1898, Marie Curie discovered radium with Pierre Curie. (event)", "id": "p2e2i2", "full": "En 1898, Marie Curie a découvert le radium avec Pierre Curie.", "audio": "a6fc0691eee"}, {"q": "Hier soir, nous ___ un documentaire sur Picasso.", "hint": "regarder", "a": ["avons regardé"], "en": "Last night we watched a documentary about Picasso.", "id": "p2e2i3", "full": "Hier soir, nous avons regardé un documentaire sur Picasso.", "audio": "ad7f6cb59cd"}, {"q": "Quand j'avais dix ans, je ___ de la poterie le mercredi.", "hint": "faire", "a": ["faisais"], "en": "When I was ten, I did pottery on Wednesdays.", "id": "p2e2i4", "full": "Quand j'avais dix ans, je faisais de la poterie le mercredi.", "audio": "ae83ee67834"}, {"q": "Les visiteurs ___ devant le musée quand la pluie a commencé.", "hint": "attendre", "a": ["attendaient"], "en": "The visitors were waiting outside the museum when the rain started.", "id": "p2e2i5", "full": "Les visiteurs attendaient devant le musée quand la pluie a commencé.", "audio": "a95ac37e47f"}, {"q": "Camille Claudel ___ en 1864.", "hint": "naître", "a": ["est née"], "en": "Camille Claudel was born in 1864.", "id": "p2e2i6", "full": "Camille Claudel est née en 1864.", "audio": "add359585ad"}], "id": "p2e2"}], "id": "p2"}, "p3": {"title": "Le gérondif", "title_en": "The gerund (en + -ant)", "rule": [["Formation : **en** + radical du verbe avec **nous** au présent + **-ant**.", "Formation: **en** + stem of the **nous** form in the present + **-ant**."], ["Le gérondif exprime la **simultanéité** : deux actions en même temps, avec le **même sujet**.", "The gerund expresses **simultaneity**: two actions at the same time, with the **same subject**."], ["Il indique aussi la **manière** : comment on fait quelque chose.", "It also shows the **manner**: how you do something."]], "formula": ["manger → nous mange|ons → en mangeant", "to eat → while eating / by eating"], "box": {"title": "Trois irréguliers · Three irregular verbs", "lines": [["être → **en étant** · avoir → **en ayant** · savoir → **en sachant**", "to be → being · to have → having · to know → knowing"]]}, "ex": [["Je dessine **en écoutant** de la musique.", "I draw while listening to music.", "af0e1f3a483"], ["On apprend beaucoup **en visitant** les musées.", "You learn a lot by visiting museums.", "aab610ccac5"], ["Elle a réussi sa sculpture **en travaillant** tous les jours.", "She succeeded with her sculpture by working every day.", "ace77c972c6"], ["**En étant** patiente, tu deviendras une grande artiste.", "By being patient, you will become a great artist.", "afec0357979"]], "exercises": [{"type": "fill", "title": "En + -ant", "title_en": "En + -ant", "c": "Lilac, écris le gérondif du verbe entre parenthèses.", "c_en": "Lilac, write the gerund of the verb in brackets.", "items": [{"q": "Je fais mes devoirs de sciences ___ de la musique.", "hint": "écouter", "a": ["en écoutant"], "en": "I do my science homework while listening to music.", "id": "p3e1i1", "full": "Je fais mes devoirs de sciences en écoutant de la musique.", "audio": "a4048e75118"}, {"q": "Le sculpteur parle aux visiteurs ___ .", "hint": "travailler", "a": ["en travaillant"], "en": "The sculptor talks to the visitors while working.", "id": "p3e1i2", "full": "Le sculpteur parle aux visiteurs en travaillant.", "audio": "a27d056467e"}, {"q": "On progresse ___ des erreurs.", "hint": "faire", "a": ["en faisant"], "en": "You make progress by making mistakes.", "id": "p3e1i3", "full": "On progresse en faisant des erreurs.", "audio": "a20c0e8c21c"}, {"q": "J'ai découvert cette artiste ___ un magazine.", "hint": "lire", "a": ["en lisant"], "en": "I discovered this artist while reading a magazine.", "id": "p3e1i4", "full": "J'ai découvert cette artiste en lisant un magazine.", "audio": "a8efd29a567"}, {"q": "___ patiente, tu réussiras ton tableau.", "hint": "être", "a": ["En étant"], "en": "By being patient, you will succeed with your painting.", "id": "p3e1i5", "full": "En étant patiente, tu réussiras ton tableau.", "audio": "afc717cc35a"}, {"q": "Elle a appris à peindre ___ les grands maîtres.", "hint": "observer", "a": ["en observant"], "en": "She learnt to paint by observing the great masters.", "id": "p3e1i6", "full": "Elle a appris à peindre en observant les grands maîtres.", "audio": "aae221ea8cd"}], "id": "p3e1"}, {"type": "order", "title": "Remets dans l'ordre", "title_en": "Put in order", "c": "Lilac, touche les mots dans le bon ordre pour faire une phrase.", "c_en": "Lilac, tap the words in the right order to make a sentence.", "items": [{"a": "Elle visite le musée en prenant des photos.", "en": "She visits the museum while taking photos.", "id": "p3e2i1", "full": "Elle visite le musée en prenant des photos.", "audio": "a03fb7423b1", "words": ["musée", "Elle", "photos", "visite", "des", "en", "le", "prenant"], "punct": "."}, {"a": "On apprend la chimie en faisant des expériences.", "en": "You learn chemistry by doing experiments.", "id": "p3e2i2", "full": "On apprend la chimie en faisant des expériences.", "audio": "aafa8bcfae4", "words": ["des", "chimie", "la", "en", "apprend", "faisant", "On", "expériences"], "punct": "."}, {"a": "Il sculpte le bois en chantant.", "en": "He carves wood while singing.", "id": "p3e2i3", "full": "Il sculpte le bois en chantant.", "audio": "aa199dbc294", "words": ["le", "en", "Il", "bois", "chantant", "sculpte"], "punct": "."}], "id": "p3e2"}], "id": "p3"}, "p4": {"title": "La restriction : ne… que · n'avoir qu'à", "title_en": "Restriction: ne… que · n'avoir qu'à", "rule": [["**ne / n'** + verbe + **que / qu'** exprime une restriction. C'est l'équivalent de **seulement**.", "**ne / n'** + verb + **que / qu'** expresses a restriction. It means **only**."], ["Au passé composé : ne + auxiliaire + participe + que.", "In the passé composé: ne + auxiliary + participle + que."], ["**n'avoir qu'à** + infinitif exprime un **conseil** ou un **reproche**.", "**n'avoir qu'à** + infinitive gives **advice** or a **reproach** (= all you have to do is…)."]], "formula": ["ne + verbe + que = seulement", "ne + verb + que = only"], "ex": [["Je **n'**aime **que** l'art moderne. = J'aime seulement l'art moderne.", "I only like modern art.", "a1ae0b8a102"], ["Ce petit musée **n'**ouvre **que** le week-end.", "This small museum only opens at the weekend.", "a0ae446989a"], ["Nous **n'**avons visité **qu'**une salle.", "We only visited one room.", "a4f756253f6"], ["Tu ne comprends pas l'exercice ? Tu **n'as qu'à** demander au professeur !", "You don't understand the exercise? Just ask the teacher!", "a5f52ed8fa6"]], "exercises": [{"type": "transform", "title": "Seulement → ne… que", "title_en": "Only → ne… que", "c": "Lilac, réécris la phrase avec ne… que.", "c_en": "Lilac, rewrite the sentence using ne… que.", "items": [{"q": "J'ai seulement deux pinceaux.", "a": ["Je n'ai que deux pinceaux."], "en": "I only have two brushes.", "id": "p4e1i1", "full": "Je n'ai que deux pinceaux.", "audio": "ad05a29306f"}, {"q": "Elle peint seulement le dimanche.", "a": ["Elle ne peint que le dimanche."], "en": "She only paints on Sundays.", "id": "p4e1i2", "full": "Elle ne peint que le dimanche.", "audio": "a2bc92ff3dd"}, {"q": "Ce scientifique croit seulement les preuves.", "a": ["Ce scientifique ne croit que les preuves."], "en": "This scientist only believes evidence.", "id": "p4e1i3", "full": "Ce scientifique ne croit que les preuves.", "audio": "a967d01a263"}, {"q": "Nous avons seulement vu une salle.", "a": ["Nous n'avons vu qu'une salle."], "en": "We only saw one room.", "id": "p4e1i4", "full": "Nous n'avons vu qu'une salle.", "audio": "ac6c82cec11"}], "id": "p4e1"}, {"type": "fill", "title": "Un conseil", "title_en": "A piece of advice", "c": "Lilac, complète avec n'avoir qu'à au présent.", "c_en": "Lilac, complete with n'avoir qu'à in the present.", "items": [{"q": "Tu es fatiguée ? Tu ___ te coucher plus tôt.", "a": ["n'as qu'à"], "en": "You're tired? Just go to bed earlier.", "id": "p4e2i1", "full": "Tu es fatiguée ? Tu n'as qu'à te coucher plus tôt.", "audio": "a697c6116ce"}, {"q": "Vous voulez voir l'expo ? Vous ___ réserver vos billets en ligne.", "a": ["n'avez qu'à"], "en": "You want to see the exhibition? Just book your tickets online.", "id": "p4e2i2", "full": "Vous voulez voir l'expo ? Vous n'avez qu'à réserver vos billets en ligne.", "audio": "a46d18bee38"}, {"q": "Ils ne comprennent pas ce tableau ? Ils ___ lire l'explication.", "a": ["n'ont qu'à"], "en": "They don't understand this painting? They just have to read the explanation.", "id": "p4e2i3", "full": "Ils ne comprennent pas ce tableau ? Ils n'ont qu'à lire l'explication.", "audio": "a5a875ed71f"}, {"q": "On s'ennuie ? On ___ aller au musée des Sciences !", "a": ["n'a qu'à"], "en": "We're bored? Let's just go to the Science Museum!", "id": "p4e2i4", "full": "On s'ennuie ? On n'a qu'à aller au musée des Sciences !", "audio": "a5a095a5d61"}], "id": "p4e2"}], "id": "p4"}, "p5": {"title": "Qui, que, ce qui, ce que · Qu'est-ce qui / que ?", "title_en": "Relative pronouns and question words", "rule": [["**qui** remplace un **sujet**. **que / qu'** remplace un **complément d'objet direct (COD)**.", "**qui** replaces a **subject**. **que / qu'** replaces a **direct object**."], ["Avec **ce** (= la chose) : **ce qui** (sujet) · **ce que** (COD).", "With **ce** (= the thing): **ce qui** (subject) · **ce que** (object) = what."], ["Pour poser une question : **Qui est-ce qui / Qui est-ce que** (une personne) · **Qu'est-ce qui / Qu'est-ce que** (une chose).", "To ask a question: Qui est-ce qui / que (a person) · Qu'est-ce qui / que (a thing)."]], "table": {"head": ["", "sujet · subject", "COD · object"], "rows": [["personne · person", "Qui est-ce **qui** … ?", "Qui est-ce **que** … ?"], ["chose · thing", "Qu'est-ce **qui** … ?", "Qu'est-ce **que** … ?"]]}, "ex": [["C'est une artiste **qui** sculpte le métal.", "She's an artist who sculpts metal.", "aa7f77dee5a"], ["La toile **que** je préfère est de Matisse.", "The canvas (that) I prefer is by Matisse.", "ab27e44396c"], ["**Ce qui** m'étonne, c'est la couleur. **Ce que** j'admire, c'est sa patience.", "What surprises me is the colour. What I admire is her patience.", "ae05146d1cc"], ["**Qu'est-ce qui** t'inspire ? **Qui est-ce que** tu admires ?", "What inspires you? Who do you admire?", "a380fdb70e0"]], "exercises": [{"type": "choose", "title": "Qui, que, ce qui, ce que", "title_en": "Qui, que, ce qui, ce que", "c": "Lilac, choisis le bon pronom.", "c_en": "Lilac, choose the right pronoun.", "items": [{"q": "Louise Bourgeois est une sculptrice ___ a créé des araignées géantes.", "opts": ["qui", "que", "ce qui"], "a": [0], "en": "Louise Bourgeois is a sculptor who created giant spiders.", "id": "p5e1i1", "full": "Louise Bourgeois est une sculptrice qui a créé des araignées géantes.", "audio": "acb3faf5180"}, {"q": "Le tableau ___ tu regardes s'appelle « Les Nymphéas ».", "opts": ["qui", "que", "ce que"], "a": [1], "en": "The painting you're looking at is called \"Water Lilies\".", "id": "p5e1i2", "full": "Le tableau que tu regardes s'appelle « Les Nymphéas ».", "audio": "accec68920a"}, {"q": "___ me plaît dans l'art moderne, c'est la liberté.", "opts": ["Ce qui", "Ce que", "Qui"], "a": [0], "en": "What I like in modern art is the freedom.", "id": "p5e1i3", "full": "Ce qui me plaît dans l'art moderne, c'est la liberté.", "audio": "a4b3a269332"}, {"q": "___ je préfère, ce sont les mobiles de Calder.", "opts": ["Ce qui", "Ce que", "Que"], "a": [1], "en": "What I prefer are Calder's mobiles.", "id": "p5e1i4", "full": "Ce que je préfère, ce sont les mobiles de Calder.", "audio": "a23f336b357"}, {"q": "C'est une expérience ___ elle a faite au laboratoire.", "opts": ["qui", "qu'", "ce qu'"], "a": [1], "en": "It's an experiment she did in the lab.", "id": "p5e1i5", "full": "C'est une expérience qu'elle a faite au laboratoire.", "audio": "aba65ad3239"}, {"q": "Dis-moi ___ tu veux voir au musée.", "opts": ["qui", "ce qui", "ce que"], "a": [2], "en": "Tell me what you want to see at the museum.", "id": "p5e1i6", "full": "Dis-moi ce que tu veux voir au musée.", "audio": "a78e2d7dc4a"}], "id": "p5e1"}, {"type": "choose", "title": "Pose la question", "title_en": "Ask the question", "c": "Lilac, choisis le bon mot interrogatif.", "c_en": "Lilac, choose the right question word.", "items": [{"q": "___ t'intéresse le plus : la peinture ou la sculpture ?", "opts": ["Qui est-ce qui", "Qu'est-ce qui", "Qu'est-ce que"], "a": [1], "en": "What interests you most: painting or sculpture?", "id": "p5e2i1", "full": "Qu'est-ce qui t'intéresse le plus : la peinture ou la sculpture ?", "audio": "a24ac117530"}, {"q": "___ tu as vu au musée hier ?", "opts": ["Qu'est-ce que", "Qu'est-ce qui", "Qui est-ce qui"], "a": [0], "en": "What did you see at the museum yesterday?", "id": "p5e2i2", "full": "Qu'est-ce que tu as vu au musée hier ?", "audio": "a2ae10adee3"}, {"q": "___ a peint « La Joconde » ?", "opts": ["Qu'est-ce qui", "Qui est-ce que", "Qui est-ce qui"], "a": [2], "en": "Who painted the \"Mona Lisa\"?", "id": "p5e2i3", "full": "Qui est-ce qui a peint « La Joconde » ?", "audio": "a49a3ba9047"}, {"q": "___ tu admires le plus parmi les scientifiques ?", "opts": ["Qui est-ce que", "Qui est-ce qui", "Qu'est-ce qui"], "a": [0], "en": "Who do you admire most among scientists?", "id": "p5e2i4", "full": "Qui est-ce que tu admires le plus parmi les scientifiques ?", "audio": "a4d6206a9a6"}], "id": "p5e2"}], "id": "p5"}, "p6": {"title": "Les adverbes d'intensité : tellement, si", "title_en": "Intensity: tellement, si (so, so much)", "rule": [["**tellement / si** + adjectif ou adverbe (+ que…)", "**tellement / si** + adjective or adverb (+ que…) = so … (that…)"], ["verbe + **tellement** (+ que…) — jamais *si* avec un verbe !", "verb + **tellement** (+ que…) = so much — never *si* with a verb!"], ["**tellement de** + nom (+ que…)", "**tellement de** + noun (+ que…) = so much / so many"]], "box": {"title": "Les trois emplois de si · The three uses of si", "lines": [["l'**intensité** : Ça fait **si** longtemps !", "**intensity**: It's been so long!"], ["répondre **oui** à une question **négative** : Tu n'aimes pas Picasso ? — **Si** !", "answering **yes** to a **negative** question: You don't like Picasso? — Yes I do!"], ["l'**hypothèse** : **Si** tu es libre, on va au musée.", "a **hypothesis**: If you're free, we'll go to the museum."]]}, "ex": [["Cette sculpture est **tellement** belle que je reste devant dix minutes.", "This sculpture is so beautiful that I stay in front of it for ten minutes.", "a9d643bc946"], ["Elle peint **si** vite qu'on ne voit pas son pinceau.", "She paints so fast that you can't see her brush.", "a2aecc4983f"], ["J'aime **tellement** l'art que je vais au musée chaque mois.", "I love art so much that I go to the museum every month.", "a7e214a0cbf"], ["Il y a **tellement de** tableaux au Louvre qu'on ne peut pas tout voir en un jour.", "There are so many paintings in the Louvre that you can't see everything in one day.", "a25bc3b022c"]], "exercises": [{"type": "choose", "title": "Tellement, tellement de ou si ?", "title_en": "Tellement, tellement de or si?", "c": "Lilac, choisis la bonne réponse. Parfois, deux réponses sont possibles !", "c_en": "Lilac, choose the right answer. Sometimes two answers are possible!", "items": [{"q": "Le musée est ___ grand que je me suis perdue.", "opts": ["tellement", "si", "tellement de"], "a": [0, 1], "en": "The museum is so big that I got lost.", "id": "p6e1i1", "full": "Le musée est tellement grand que je me suis perdue.", "audio": "a9b66643285"}, {"q": "Il y a ___ visiteurs qu'on ne voit pas le tableau.", "opts": ["tellement", "si", "tellement de"], "a": [2], "en": "There are so many visitors that you can't see the painting.", "id": "p6e1i2", "full": "Il y a tellement de visiteurs qu'on ne voit pas le tableau.", "audio": "ad429efc84c"}, {"q": "Elle travaille ___ qu'elle oublie de manger.", "opts": ["tellement", "si", "tellement de"], "a": [0], "en": "She works so much that she forgets to eat.", "id": "p6e1i3", "full": "Elle travaille tellement qu'elle oublie de manger.", "audio": "ab1795be4b9"}, {"q": "J'ai ___ projets que je ne sais pas quoi dessiner !", "opts": ["tellement", "si", "tellement de"], "a": [2], "en": "I have so many projects that I don't know what to draw!", "id": "p6e1i4", "full": "J'ai tellement de projets que je ne sais pas quoi dessiner !", "audio": "a19612ef11a"}, {"q": "Cette expérience est ___ dangereuse qu'on porte des lunettes.", "opts": ["tellement", "si", "tellement de"], "a": [0, 1], "en": "This experiment is so dangerous that we wear goggles.", "id": "p6e1i5", "full": "Cette expérience est tellement dangereuse qu'on porte des lunettes.", "audio": "a923a841e05"}], "id": "p6e1"}, {"type": "qcm", "title": "Quel emploi de si ?", "title_en": "Which use of si?", "c": "Lilac, dis quel est le sens de si dans chaque phrase.", "c_en": "Lilac, say what si means in each sentence.", "items": [{"q": "Tu n'aimes pas l'art abstrait ? — Si, je l'adore !", "opts": ["intensité", "réponse « oui »", "hypothèse"], "a": [1], "en": "You don't like abstract art? — Yes I do, I love it!", "id": "p6e2i1", "full": "Tu n'aimes pas l'art abstrait ? — Si, je l'adore !", "audio": "a7271a46441"}, {"q": "Si tu as le temps samedi, on va voir l'expo Kusama.", "opts": ["intensité", "réponse « oui »", "hypothèse"], "a": [2], "en": "If you have time on Saturday, we'll go and see the Kusama exhibition.", "id": "p6e2i2", "full": "Si tu as le temps samedi, on va voir l'expo Kusama.", "audio": "af3b8c85a9f"}, {"q": "Ça fait si longtemps que je n'ai pas peint !", "opts": ["intensité", "réponse « oui »", "hypothèse"], "a": [0], "en": "It's been so long since I last painted!", "id": "p6e2i3", "full": "Ça fait si longtemps que je n'ai pas peint !", "audio": "af4575ed8e8"}], "id": "p6e2"}], "id": "p6"}, "p7": {"title": "Les doubles pronoms compléments", "title_en": "Double object pronouns", "rule": [["Quand il y a deux pronoms, on suit un **ordre fixe**.", "When there are two pronouns, they follow a **fixed order**."], ["**me, te, nous, vous** se placent **avant** le, la, les.", "**me, te, nous, vous** go **before** le, la, les."], ["Mais **le, la, les** se placent **avant lui, leur**.", "But **le, la, les** go **before lui, leur**."], ["Les deux pronoms restent ensemble devant le verbe conjugué (ou devant l'infinitif).", "Both pronouns stay together before the conjugated verb (or before the infinitive)."]], "formula": ["me / te / nous / vous → le / la / les → lui / leur", "order of pronouns"], "ex": [["Tu me prêtes ton carnet de croquis ? — Oui, je **te le** prête.", "Will you lend me your sketchbook? — Yes, I'll lend it to you.", "a0ce65ab2a4"], ["Le guide montre la statue aux élèves. → Le guide **la leur** montre.", "The guide shows the statue to the pupils. → The guide shows it to them.", "a68cdb43275"], ["Ma prof m'a expliqué la règle. → Elle **me l'**a expliquée.", "My teacher explained the rule to me. → She explained it to me.", "a082eec1d71"], ["Je ne vais pas **te la** donner.", "I'm not going to give it to you.", "ac3e8632dee"]], "exercises": [{"type": "order", "title": "Remets dans l'ordre", "title_en": "Put in order", "c": "Lilac, touche les mots dans le bon ordre.", "c_en": "Lilac, tap the words in the right order.", "items": [{"a": "Je te la montre.", "en": "I'm showing it to you. (la photo)", "id": "p7e1i1", "full": "Je te la montre.", "audio": "abd45f7955f", "words": ["te", "la", "Je", "montre"], "punct": "."}, {"a": "Le professeur les leur explique.", "en": "The teacher explains them to them.", "id": "p7e1i2", "full": "Le professeur les leur explique.", "audio": "ac886452686", "words": ["leur", "explique", "professeur", "les", "Le"], "punct": "."}, {"a": "Elle ne me le prête pas.", "en": "She doesn't lend it to me.", "id": "p7e1i3", "full": "Elle ne me le prête pas.", "audio": "a6c2076f650", "words": ["pas", "ne", "le", "Elle", "prête", "me"], "punct": "."}, {"a": "Nous allons vous les montrer.", "en": "We are going to show them to you.", "id": "p7e1i4", "full": "Nous allons vous les montrer.", "audio": "a447779b103", "words": ["vous", "allons", "montrer", "les", "Nous"], "punct": "."}], "id": "p7e1"}, {"type": "fill", "title": "Remplace par deux pronoms", "title_en": "Replace with two pronouns", "c": "Lilac, complète la réponse avec les deux pronoms.", "c_en": "Lilac, complete the answer with the two pronouns.", "items": [{"q": "Tu prêtes ton pinceau à Léa ? — Oui, je ___ prête.", "a": ["le lui"], "en": "Are you lending your brush to Léa? — Yes, I'm lending it to her.", "id": "p7e2i1", "full": "Tu prêtes ton pinceau à Léa ? Oui, je le lui prête.", "audio": "add94500a1a"}, {"q": "Le guide montre les sculptures aux visiteurs ? — Oui, il ___ montre.", "a": ["les leur"], "en": "Does the guide show the sculptures to the visitors? — Yes, he shows them to them.", "id": "p7e2i2", "full": "Le guide montre les sculptures aux visiteurs ? Oui, il les leur montre.", "audio": "a12aa928b3b"}, {"q": "Tu m'envoies la photo de ton tableau ? — Oui, je ___ envoie.", "a": ["te l'"], "en": "Will you send me the photo of your painting? — Yes, I'll send it to you.", "why": "te + la → te l' devant une voyelle · te + la → te l' before a vowel", "id": "p7e2i3", "full": "Tu m'envoies la photo de ton tableau ? Oui, je te l'envoie.", "audio": "a4cce064e0b"}, {"q": "Nos parents nous offrent les billets ? — Non, ils ne ___ offrent pas.", "a": ["nous les"], "en": "Are our parents giving us the tickets? — No, they're not giving them to us.", "id": "p7e2i4", "full": "Nos parents nous offrent les billets ? Non, ils ne nous les offrent pas.", "audio": "a19a1c1ac6a"}, {"q": "Tu as donné le dessin à ta mère ? — Oui, je ___ ai donné.", "a": ["le lui"], "en": "Did you give the drawing to your mother? — Yes, I gave it to her.", "id": "p7e2i5", "full": "Tu as donné le dessin à ta mère ? Oui, je le lui ai donné.", "audio": "ae3284467cf"}], "id": "p7e2"}], "id": "p7"}, "p8": {"title": "Les pronoms démonstratifs", "title_en": "Demonstrative pronouns", "rule": [["Ils reprennent un nom déjà mentionné pour **éviter une répétition**.", "They replace a noun already mentioned to **avoid repeating** it."], ["**celui** (masc. sing.) · **celle** (fém. sing.) · **ceux** (masc. plur.) · **celles** (fém. plur.)", "the one / the ones: celui · celle · ceux · celles"], ["Ils sont suivis de **-ci / -là**, de **de**, ou d'un pronom relatif **qui / que / où**.", "They are followed by **-ci / -là**, by **de**, or by a relative pronoun **qui / que / où**."]], "box": {"title": "-ci / -là", "lines": [["**-ci** indique la proximité, **-là** l'éloignement.", "**-ci** = this one (near), **-là** = that one (further away)."]]}, "ex": [["Tu préfères quel tableau ? **Celui-ci** ou **celui-là** ?", "Which painting do you prefer? This one or that one?", "a0127c653b4"], ["J'aime les sculptures de Rodin, mais je préfère **celles de** Camille Claudel.", "I like Rodin's sculptures, but I prefer Camille Claudel's.", "aeeae31e127"], ["Cette expo est plus intéressante que **celle qu'**on a vue l'an dernier.", "This exhibition is more interesting than the one we saw last year.", "a72cfe6daaf"], ["Les élèves du club d'art sont **ceux qui** aiment dessiner.", "The pupils in the art club are the ones who like drawing.", "a84d2121908"]], "exercises": [{"type": "choose", "title": "Celui, celle, ceux, celles", "title_en": "Celui, celle, ceux, celles", "c": "Lilac, choisis le bon pronom démonstratif.", "c_en": "Lilac, choose the right demonstrative pronoun.", "items": [{"q": "Ce pinceau-ci est trop gros, prends ___-là.", "opts": ["celui", "celle", "ceux"], "a": [0], "en": "This brush is too thick, take that one.", "id": "p8e1i1", "full": "Ce pinceau-ci est trop gros, prends celui-là.", "audio": "a75ce7e1108"}, {"q": "Ma photo est floue, mais ___ de Léa est parfaite.", "opts": ["celui", "celle", "celles"], "a": [1], "en": "My photo is blurry, but Léa's is perfect.", "id": "p8e1i2", "full": "Ma photo est floue, mais celle de Léa est parfaite.", "audio": "a7daf179885"}, {"q": "Ces dessins sont jolis, mais ___ d'Hugo sont plus originaux.", "opts": ["ceux", "celles", "celui"], "a": [0], "en": "These drawings are nice, but Hugo's are more original.", "id": "p8e1i3", "full": "Ces dessins sont jolis, mais ceux d'Hugo sont plus originaux.", "audio": "a428235825f"}, {"q": "Les toiles de Monet ? Ce sont ___ que je préfère.", "opts": ["ceux", "celle", "celles"], "a": [2], "en": "Monet's canvases? They're the ones I prefer.", "id": "p8e1i4", "full": "Les toiles de Monet ? Ce sont celles que je préfère.", "audio": "ae2318d57c5"}, {"q": "Quel musée tu préfères ? ___ où il y a des dinosaures !", "opts": ["Celui", "Celle", "Ceux"], "a": [0], "en": "Which museum do you prefer? The one with the dinosaurs!", "id": "p8e1i5", "full": "Quel musée tu préfères ? Celui où il y a des dinosaures !", "audio": "a3fbde6cc34"}, {"q": "Cette planète-ci, c'est Mars ; ___-là, c'est Jupiter.", "opts": ["celui", "celle", "celles"], "a": [1], "en": "This planet is Mars; that one is Jupiter.", "id": "p8e1i6", "full": "Cette planète-ci, c'est Mars ; celle-là, c'est Jupiter.", "audio": "a251c5d51e4"}], "id": "p8e1"}, {"type": "choose", "title": "De, qui, que ou où ?", "title_en": "De, qui, que or où?", "c": "Lilac, choisis le mot qui suit le pronom démonstratif.", "c_en": "Lilac, choose the word that follows the demonstrative pronoun.", "items": [{"q": "Ce n'est pas mon carnet, c'est celui ___ ma sœur.", "opts": ["de", "qui", "que", "où"], "a": [0], "en": "It's not my sketchbook, it's my sister's.", "id": "p8e2i1", "full": "Ce n'est pas mon carnet, c'est celui de ma sœur.", "audio": "a350650539c"}, {"q": "Cette sculpture est celle ___ j'ai faite en cours d'arts.", "opts": ["de", "qui", "que", "où"], "a": [2], "en": "This sculpture is the one I made in art class.", "id": "p8e2i2", "full": "Cette sculpture est celle que j'ai faite en cours d'arts.", "audio": "afcda1045a6"}, {"q": "Les artistes célèbres ne sont pas toujours ceux ___ vendent le plus.", "opts": ["de", "qui", "que", "où"], "a": [1], "en": "Famous artists are not always the ones who sell the most.", "id": "p8e2i3", "full": "Les artistes célèbres ne sont pas toujours ceux qui vendent le plus.", "audio": "a6cccf0223a"}, {"q": "L'atelier de Brancusi ? C'est celui ___ il a travaillé toute sa vie.", "opts": ["de", "qui", "que", "où"], "a": [3], "en": "Brancusi's studio? It's the one where he worked all his life.", "id": "p8e2i4", "full": "L'atelier de Brancusi ? C'est celui où il a travaillé toute sa vie.", "audio": "ae3e0ebc7b1"}], "id": "p8e2"}], "id": "p8"}, "p9": {"title": "L'interrogation directe et indirecte", "title_en": "Direct and indirect questions", "rule": [["**Directe** : on pose la question. Mots : qui, où, comment, combien (de), pourquoi, quand, quel(le)(s), lequel…", "**Direct**: you ask the question. Words: who, where, how, how much/many, why, when, which…"], ["**Indirecte** : elle commence par un verbe (je me demande, dis-moi, je voudrais savoir, je ne sais pas…) et n'a **pas de point d'interrogation**.", "**Indirect**: it starts with a verb (I wonder, tell me, I'd like to know, I don't know…) and has **no question mark**."]], "table": {"head": ["Directe · Direct", "Indirecte · Indirect"], "rows": [["est-ce que / question oui-non", "→ **si**"], ["qu'est-ce que", "→ **ce que**"], ["qu'est-ce qui", "→ **ce qui**"], ["où, quand, comment, combien, pourquoi, qui…", "→ ne changent pas · don't change"]]}, "ex": [["« Est-ce que tu aimes Picasso ? » → Je me demande **si** tu aimes Picasso.", "I wonder if you like Picasso.", "a5f6f99bcfb"], ["« Qu'est-ce que tu dessines ? » → Dis-moi **ce que** tu dessines.", "Tell me what you're drawing.", "a78ed6f838e"], ["« Qu'est-ce qui t'inspire ? » → Je voudrais savoir **ce qui** t'inspire.", "I'd like to know what inspires you.", "a50ed0c8608"], ["« Où se trouve l'atelier ? » → Je ne sais pas **où** se trouve l'atelier.", "I don't know where the studio is.", "ae421b64d88"]], "exercises": [{"type": "choose", "title": "Le bon mot", "title_en": "The right word", "c": "Lilac, choisis le mot qui introduit la question indirecte.", "c_en": "Lilac, choose the word that introduces the indirect question.", "items": [{"q": "« Est-ce que tu viens à l'expo ? » → Je me demande ___ tu viens à l'expo.", "opts": ["si", "ce que", "ce qui"], "a": [0], "en": "I wonder if you're coming to the exhibition.", "id": "p9e1i1", "full": "Je me demande si tu viens à l'expo.", "audio": "a829076dc43"}, {"q": "« Qu'est-ce que tu penses de ce tableau ? » → Dis-moi ___ tu penses de ce tableau.", "opts": ["si", "ce que", "ce qui"], "a": [1], "en": "Tell me what you think of this painting.", "id": "p9e1i2", "full": "Dis-moi ce que tu penses de ce tableau.", "audio": "a64202354e7"}, {"q": "« Qu'est-ce qui est difficile en sculpture ? » → Je voudrais savoir ___ est difficile en sculpture.", "opts": ["si", "ce que", "ce qui"], "a": [2], "en": "I'd like to know what is difficult in sculpture.", "id": "p9e1i3", "full": "Je voudrais savoir ce qui est difficile en sculpture.", "audio": "a198443a590"}, {"q": "« Combien coûte le billet ? » → Je ne sais pas ___ coûte le billet.", "opts": ["combien", "ce que", "si"], "a": [0], "en": "I don't know how much the ticket costs.", "id": "p9e1i4", "full": "Je ne sais pas combien coûte le billet.", "audio": "a7c0012da91"}, {"q": "« Comment fonctionne ce microscope ? » → Explique-moi ___ fonctionne ce microscope.", "opts": ["ce qui", "comment", "si"], "a": [1], "en": "Explain to me how this microscope works.", "id": "p9e1i5", "full": "Explique-moi comment fonctionne ce microscope.", "audio": "a8f7efe17e1"}], "id": "p9e1"}, {"type": "transform", "title": "Écris la question indirecte", "title_en": "Write the indirect question", "c": "Lilac, transforme en interrogation indirecte. Le début de la phrase est donné.", "c_en": "Lilac, turn it into an indirect question. The beginning of the sentence is given.", "items": [{"q": "« Est-ce que la chimie est difficile ? »", "lead": "Je me demande…", "a": ["Je me demande si la chimie est difficile."], "en": "I wonder if chemistry is difficult.", "id": "p9e2i1", "full": "Je me demande si la chimie est difficile.", "audio": "ae965aff3d8"}, {"q": "« Qu'est-ce que tu vas peindre ? »", "lead": "Dis-moi…", "a": ["Dis-moi ce que tu vas peindre."], "en": "Tell me what you're going to paint.", "id": "p9e2i2", "full": "Dis-moi ce que tu vas peindre.", "audio": "a2c11dcc71a"}, {"q": "« Où est l'atelier ? »", "lead": "Je ne sais pas…", "a": ["Je ne sais pas où est l'atelier.", "Je ne sais pas où l'atelier est."], "en": "I don't know where the studio is.", "id": "p9e2i3", "full": "Je ne sais pas où est l'atelier.", "audio": "a0e872b41a8"}], "id": "p9e2"}], "id": "p9"}, "p10": {"title": "Lequel, auquel, duquel…", "title_en": "Lequel, auquel, duquel… (which one?)", "rule": [["**lequel, laquelle, lesquels, lesquelles** remplacent **quel + nom** dans une question.", "**lequel, laquelle, lesquels, lesquelles** replace **quel + noun** in a question (= which one(s)?)."], ["Avec **à** et **de**, ils se contractent comme le, les : à + le = au, de + le = du.", "With **à** and **de** they contract, like le and les: à + le = au, de + le = du."]], "table": {"head": ["", "à + …", "de + …"], "rows": [["lequel", "**auquel**", "**duquel**"], ["laquelle", "à laquelle", "de laquelle"], ["lesquels", "**auxquels**", "**desquels**"], ["lesquelles", "**auxquelles**", "**desquelles**"]]}, "ex": [["J'ai deux pinceaux. **Lequel** veux-tu ?", "I've got two brushes. Which one do you want?", "ac96c0e007a"], ["**Laquelle** de ces sculptures préfères-tu ?", "Which of these sculptures do you prefer?", "a5463082d64"], ["Tu penses à un artiste ? **Auquel** ?", "You're thinking of an artist? Which one?", "a82386b8fff"], ["Tu parles de quels tableaux ? **Desquels** ?", "Which paintings are you talking about? Which ones?", "a2eab3c995d"]], "exercises": [{"type": "choose", "title": "Remplace quel + nom", "title_en": "Replace quel + noun", "c": "Lilac, remplace les mots en gras par le bon pronom.", "c_en": "Lilac, replace the words in bold with the right pronoun.", "items": [{"q": "**Quelle peinture** préfères-tu ? → ___ préfères-tu ?", "opts": ["Lequel", "Laquelle", "Lesquelles"], "a": [1], "en": "Which painting do you prefer? → Which one do you prefer?", "id": "p10e1i1", "full": "Laquelle préfères-tu ?", "audio": "a10451c31f6"}, {"q": "Tu vas visiter **quels musées** ? → Tu vas visiter ___ ?", "opts": ["lesquels", "lesquelles", "lequel"], "a": [0], "en": "Which museums are you going to visit? → Which ones?", "id": "p10e1i2", "full": "Tu vas visiter lesquels ?", "audio": "a744ae34c2d"}, {"q": "**À quel concours** participes-tu ? → ___ participes-tu ?", "opts": ["Lequel", "Auquel", "Duquel"], "a": [1], "en": "Which competition are you taking part in? → Which one?", "id": "p10e1i3", "full": "Auquel participes-tu ?", "audio": "a2429e27d37"}, {"q": "**De quel scientifique** parles-tu ? → ___ parles-tu ?", "opts": ["Duquel", "Auquel", "Desquels"], "a": [0], "en": "Which scientist are you talking about? → Which one?", "id": "p10e1i4", "full": "Duquel parles-tu ?", "audio": "a8310b1e90c"}, {"q": "**À quelles expositions** penses-tu ? → ___ penses-tu ?", "opts": ["Auxquels", "Auxquelles", "Desquelles"], "a": [1], "en": "Which exhibitions are you thinking of? → Which ones?", "id": "p10e1i5", "full": "Auxquelles penses-tu ?", "audio": "a51346c95bf"}, {"q": "**De quelle œuvre** as-tu besoin ? → ___ as-tu besoin ?", "opts": ["Duquel", "De laquelle", "Desquelles"], "a": [1], "en": "Which work do you need? → Which one?", "id": "p10e1i6", "full": "De laquelle as-tu besoin ?", "audio": "a168284439b"}], "id": "p10e1"}], "id": "p10"}, "p11": {"title": "L'accord du participe passé", "title_en": "Past participle agreement", "img": "x6.jpg", "rule": [["Avec **être** : le participe s'accorde avec le **sujet**.", "With **être**: the participle agrees with the **subject**."], ["Avec **avoir** : pas d'accord avec le sujet. **Mais** il s'accorde avec le **COD** si le COD est placé **avant** le verbe (que, l', la, les…).", "With **avoir**: no agreement with the subject. **But** it agrees with the **direct object** if the object comes **before** the verb (que, l', la, les…)."]], "formula": ["COD avant + avoir → accord", "object before + avoir → agreement"], "ex": [["Elle est **allée** au musée.", "She went to the museum. (être → agrees with elle)", "afa2b36819a"], ["Elle a **regardé** les sculptures.", "She looked at the sculptures. (object after → no agreement)", "a95abeea9de"], ["Les sculptures **qu'**elle a **regardées** sont en bronze.", "The sculptures she looked at are bronze. (que = les sculptures, before)", "a05c7f1c2df"], ["Cette photo ? Je **l'**ai **prise** à Paris.", "This photo? I took it in Paris.", "af4c43aca9a"]], "exercises": [{"type": "choose", "title": "Quelle terminaison ?", "title_en": "Which ending?", "c": "Lilac, choisis la bonne terminaison du participe passé (— = pas de lettre).", "c_en": "Lilac, choose the right ending for the past participle (— = no letter).", "items": [{"q": "Les tableaux que Lilac a peint___ sont exposés.", "opts": ["—", "e", "s", "es"], "a": [2], "en": "The paintings Lilac painted are on display.", "full": "Les tableaux que Lilac a peints sont exposés.", "id": "p11e1i1", "audio": "a3f5f770f08"}, {"q": "Ma sœur est arrivé___ en retard au cours de dessin.", "opts": ["—", "e", "s", "es"], "a": [1], "en": "My sister arrived late for the drawing class.", "full": "Ma sœur est arrivée en retard au cours de dessin.", "id": "p11e1i2", "audio": "a13840bdb93"}, {"q": "Elle a acheté___ deux livres sur Matisse.", "opts": ["—", "e", "s", "es"], "a": [0], "en": "She bought two books about Matisse.", "full": "Elle a acheté deux livres sur Matisse.", "id": "p11e1i3", "audio": "a6211aa728d"}, {"q": "Cette expérience, nous l'avons réussi___ !", "opts": ["—", "e", "s", "es"], "a": [1], "en": "We succeeded with this experiment!", "full": "Cette expérience, nous l'avons réussie !", "id": "p11e1i4", "audio": "a5d1c4a95d2"}, {"q": "Les photos que j'ai pris___ au musée sont floues.", "opts": ["—", "e", "s", "es"], "a": [3], "en": "The photos I took at the museum are blurry.", "full": "Les photos que j'ai prises au musée sont floues.", "id": "p11e1i5", "audio": "ac2fb9b3743"}, {"q": "Mes amies sont venu___ voir mon exposition.", "opts": ["—", "e", "s", "es"], "a": [3], "en": "My friends came to see my exhibition.", "full": "Mes amies sont venues voir mon exposition.", "id": "p11e1i6", "audio": "a59857286b2"}], "id": "p11e1"}, {"type": "fill", "title": "Au passé composé", "title_en": "In the passé composé", "c": "Lilac, conjugue le verbe au passé composé. Attention à l'accord !", "c_en": "Lilac, conjugate the verb in the passé composé. Watch the agreement!", "items": [{"q": "La statue que nous ___ hier était immense.", "hint": "voir", "a": ["avons vue"], "en": "The statue we saw yesterday was huge.", "id": "p11e2i1", "full": "La statue que nous avons vue hier était immense.", "audio": "aca410eee31"}, {"q": "Ces lunettes de protection ? Je les ___ pour l'expérience.", "hint": "mettre", "a": ["ai mises"], "en": "These safety goggles? I put them on for the experiment.", "id": "p11e2i2", "full": "Ces lunettes de protection ? Je les ai mises pour l'expérience.", "audio": "a4f72ffd967"}, {"q": "Les élèves ___ au musée à 9 heures.", "hint": "partir", "a": ["sont partis"], "en": "The pupils left for the museum at 9 o'clock.", "id": "p11e2i3", "full": "Les élèves sont partis au musée à 9 heures.", "audio": "a014b5bf670"}, {"q": "La lettre que Camille Claudel ___ à Rodin est célèbre.", "hint": "écrire", "a": ["a écrite"], "en": "The letter Camille Claudel wrote to Rodin is famous.", "id": "p11e2i4", "full": "La lettre que Camille Claudel a écrite à Rodin est célèbre.", "audio": "a2ebeac275d"}], "id": "p11e2"}], "id": "p11"}, "p12": {"title": "Le pronom relatif dont", "title_en": "The relative pronoun dont", "rule": [["**dont** remplace un complément introduit par **de**.", "**dont** replaces a complement introduced by **de** (= of which, about which, whose)."], ["verbe + de : parler **de**, avoir besoin **de**, se souvenir **de**, avoir peur **de**, être fan **de**…", "verb + de: to talk about, to need, to remember, to be afraid of, to be a fan of…"], ["nom + de : la couverture **du** livre → un livre **dont** la couverture…", "noun + de: the cover of the book → a book whose cover…"]], "ex": [["C'est un livre **dont** tout le monde parle. (parler de)", "It's a book everyone is talking about.", "a3128d260b3"], ["Voici le microscope **dont** j'ai besoin. (avoir besoin de)", "Here is the microscope I need.", "af954a02a3e"], ["Frida Kahlo est une artiste **dont** je suis fan. (être fan de)", "Frida Kahlo is an artist I'm a fan of.", "afcc6d3639c"], ["J'ai lu un roman **dont** la couverture est un tableau de Magritte.", "I read a novel whose cover is a painting by Magritte.", "a12cedd34ec"]], "exercises": [{"type": "choose", "title": "Qui, que, dont ou où ?", "title_en": "Qui, que, dont or où?", "c": "Lilac, choisis le bon pronom relatif.", "c_en": "Lilac, choose the right relative pronoun.", "items": [{"q": "C'est la sculpture ___ je t'ai parlé.", "opts": ["qui", "que", "dont", "où"], "a": [2], "en": "It's the sculpture I told you about.", "id": "p12e1i1", "full": "C'est la sculpture dont je t'ai parlé.", "audio": "a8504397ab1"}, {"q": "C'est la sculpture ___ j'ai vue à Paris.", "opts": ["qui", "que", "dont", "où"], "a": [1], "en": "It's the sculpture I saw in Paris.", "id": "p12e1i2", "full": "C'est la sculpture que j'ai vue à Paris.", "audio": "aef68c04237"}, {"q": "C'est la sculpture ___ est dans le jardin du musée.", "opts": ["qui", "que", "dont", "où"], "a": [0], "en": "It's the sculpture that is in the museum garden.", "id": "p12e1i3", "full": "C'est la sculpture qui est dans le jardin du musée.", "audio": "a2e5e50fc22"}, {"q": "C'est la ville ___ Camille Claudel est née.", "opts": ["qui", "que", "dont", "où"], "a": [3], "en": "It's the town where Camille Claudel was born.", "id": "p12e1i4", "full": "C'est la ville où Camille Claudel est née.", "audio": "a10e1369588"}, {"q": "Marie Curie est une scientifique ___ je suis fan.", "opts": ["qui", "que", "dont", "où"], "a": [2], "en": "Marie Curie is a scientist I'm a fan of.", "id": "p12e1i5", "full": "Marie Curie est une scientifique dont je suis fan.", "audio": "abe394a149c"}, {"q": "C'est un peintre ___ les tableaux sont très colorés.", "opts": ["qui", "que", "dont", "où"], "a": [2], "en": "He's a painter whose paintings are very colourful.", "id": "p12e1i6", "full": "C'est un peintre dont les tableaux sont très colorés.", "audio": "ac0dfc6b182"}], "id": "p12e1"}, {"type": "transform", "title": "Une seule phrase", "title_en": "Just one sentence", "c": "Lilac, fais une seule phrase avec dont.", "c_en": "Lilac, make one single sentence with dont.", "items": [{"q": "J'ai acheté un livre. Tout le monde parle de ce livre.", "a": ["J'ai acheté un livre dont tout le monde parle."], "en": "I bought a book everyone is talking about.", "id": "p12e2i1", "full": "J'ai acheté un livre dont tout le monde parle.", "audio": "a0baa5bfeb9"}, {"q": "Voici la peinture. J'ai besoin de cette peinture pour mon exposé.", "a": ["Voici la peinture dont j'ai besoin pour mon exposé."], "en": "Here is the painting I need for my presentation.", "id": "p12e2i2", "full": "Voici la peinture dont j'ai besoin pour mon exposé.", "audio": "a2af1537808"}, {"q": "C'est une artiste. Je suis fan de cette artiste.", "a": ["C'est une artiste dont je suis fan."], "en": "She's an artist I'm a fan of.", "id": "p12e2i3", "full": "C'est une artiste dont je suis fan.", "audio": "a7c23f936a7"}, {"q": "J'ai vu un film. La fin de ce film est étonnante.", "a": ["J'ai vu un film dont la fin est étonnante."], "en": "I saw a film whose ending is surprising.", "id": "p12e2i4", "full": "J'ai vu un film dont la fin est étonnante.", "audio": "a9c99dac1fb"}], "id": "p12e2"}], "id": "p12"}, "p13": {"title": "Le subjonctif présent (1) : la formation", "title_en": "The present subjunctive (1): how to form it", "img": "x1.jpg", "rule": [["On prend le radical de **ils** au présent, puis on ajoute : **-e, -es, -e, -ions, -iez, -ent**.", "Take the stem of the **ils** form in the present, then add: **-e, -es, -e, -ions, -iez, -ent**."], ["Le subjonctif vient souvent après **que** : il faut que, je veux que… et après **sans que**.", "The subjunctive often comes after **que**: il faut que, je veux que… and after **sans que** (= without…)."]], "table": {"head": ["peindre (ils peign|ent)", "être", "avoir", "aller", "faire"], "rows": [["que je **peigne**", "que je **sois**", "que j'**aie**", "que j'**aille**", "que je **fasse**"], ["que tu **peignes**", "que tu **sois**", "que tu **aies**", "que tu **ailles**", "que tu **fasses**"], ["qu'il/elle **peigne**", "qu'il **soit**", "qu'il **ait**", "qu'il **aille**", "qu'il **fasse**"], ["que nous **peignions**", "que nous **soyons**", "que nous **ayons**", "que nous **allions**", "que nous **fassions**"], ["que vous **peigniez**", "que vous **soyez**", "que vous **ayez**", "que vous **alliez**", "que vous **fassiez**"], ["qu'ils/elles **peignent**", "qu'ils **soient**", "qu'ils **aient**", "qu'ils **aillent**", "qu'ils **fassent**"]], "audio": [["a5d8638f357", "a260e984f6c", "a0174cf2ca1", "a7b9596ffe3", "a4645552b01"], ["a7459bc6475", "af0417f4193", "a11c5362277", "a92b630e62e", "acd4368fb1c"], ["af529aba220", "abf78a4f9e2", "aab09a98082", "a303da60a06", "ac91640ac8a"], ["ad4d8b2b1b5", "a539f818b89", "adb25a9a690", "a08252c34b3", "aa1fc941fef"], ["a5e9a3ad1fa", "aac97b55863", "a77955afee0", "a09fa12518e", "a3c90c63638"], ["ab136bcf020", "a9a9bd9b584", "a38f28862f5", "a90506c37cc", "a836edb1b57"]]}, "box": {"title": "Autres irréguliers · Other irregular verbs", "lines": [["pouvoir → que je **puisse** · savoir → que je **sache** · vouloir → que je **veuille** · venir → que je **vienne**, que nous **venions**", "to be able → puisse · to know → sache · to want → veuille · to come → vienne / venions"]]}, "ex": [["Il faut que je **finisse** ma sculpture avant vendredi.", "I have to finish my sculpture before Friday.", "a0556dd33d4"], ["Le professeur veut que nous **allions** au musée.", "The teacher wants us to go to the museum.", "a26c63cc621"], ["Il faut que tu **sois** patiente.", "You need to be patient.", "a15d0f8bda0"], ["Elle dessine **sans que** ses parents le **sachent**.", "She draws without her parents knowing.", "a35372db86e"]], "exercises": [{"type": "qcm", "title": "Indicatif ou subjonctif ?", "title_en": "Indicative or subjunctive?", "c": "Lilac, dis si le verbe en gras est à l'indicatif ou au subjonctif.", "c_en": "Lilac, say if the verb in bold is in the indicative or the subjunctive.", "items": [{"q": "Je sais que tu **peins** très bien.", "opts": ["indicatif", "subjonctif"], "a": [0], "en": "I know you paint very well.", "id": "p13e1i1", "full": "Je sais que tu peins très bien.", "audio": "ae307143c72"}, {"q": "Il faut que tu **peignes** la mer.", "opts": ["indicatif", "subjonctif"], "a": [1], "en": "You have to paint the sea.", "id": "p13e1i2", "full": "Il faut que tu peignes la mer.", "audio": "a94015d1ca2"}, {"q": "Je crois que nous **allons** au musée demain.", "opts": ["indicatif", "subjonctif"], "a": [0], "en": "I think we're going to the museum tomorrow.", "id": "p13e1i3", "full": "Je crois que nous allons au musée demain.", "audio": "a46d012e725"}, {"q": "Mes parents veulent que nous **allions** au musée.", "opts": ["indicatif", "subjonctif"], "a": [1], "en": "My parents want us to go to the museum.", "id": "p13e1i4", "full": "Mes parents veulent que nous allions au musée.", "audio": "a3928ec99a0"}, {"q": "Il faudrait que vous **ayez** vos billets.", "opts": ["indicatif", "subjonctif"], "a": [1], "en": "You should have your tickets.", "id": "p13e1i5", "full": "Il faudrait que vous ayez vos billets.", "audio": "ab35425d912"}, {"q": "Je pense qu'elle **a** raison.", "opts": ["indicatif", "subjonctif"], "a": [0], "en": "I think she's right.", "id": "p13e1i6", "full": "Je pense qu'elle a raison.", "audio": "acdebccf3b7"}], "id": "p13e1"}, {"type": "fill", "title": "Il faut que…", "title_en": "Il faut que…", "c": "Lilac, conjugue le verbe au subjonctif présent.", "c_en": "Lilac, conjugate the verb in the present subjunctive.", "items": [{"q": "Il faut que je ___ mon tableau.", "hint": "finir", "a": ["finisse"], "en": "I have to finish my painting.", "id": "p13e2i1", "full": "Il faut que je finisse mon tableau.", "audio": "ad0ec7734b6"}, {"q": "Il faut que nous ___ au laboratoire.", "hint": "aller", "a": ["allions"], "en": "We have to go to the lab.", "id": "p13e2i2", "full": "Il faut que nous allions au laboratoire.", "audio": "afb51d8fce4"}, {"q": "Il faut que tu ___ à l'heure pour le vernissage.", "hint": "être", "a": ["sois"], "en": "You have to be on time for the opening.", "id": "p13e2i3", "full": "Il faut que tu sois à l'heure pour le vernissage.", "audio": "aae39d4e9f6"}, {"q": "Il faut qu'elle ___ des croquis avant de sculpter.", "hint": "faire", "a": ["fasse"], "en": "She has to make sketches before sculpting.", "id": "p13e2i4", "full": "Il faut qu'elle fasse des croquis avant de sculpter.", "audio": "a9a4f095da4"}, {"q": "Il faut que vous ___ voir mon exposition !", "hint": "venir", "a": ["veniez"], "en": "You have to come and see my exhibition!", "id": "p13e2i5", "full": "Il faut que vous veniez voir mon exposition !", "audio": "af02bf1a7ef"}, {"q": "Il faut qu'ils ___ un article sur l'expo.", "hint": "écrire", "a": ["écrivent"], "en": "They have to write an article about the exhibition.", "id": "p13e2i6", "full": "Il faut qu'ils écrivent un article sur l'expo.", "audio": "a33f748cc1e"}], "id": "p13e2"}, {"type": "transform", "title": "Sans que…", "title_en": "Without…", "c": "Lilac, transforme la phrase avec sans que + subjonctif.", "c_en": "Lilac, transform the sentence with sans que + subjunctive.", "items": [{"q": "Elle sort de l'atelier mais on ne la voit pas.", "a": ["Elle sort de l'atelier sans qu'on la voie."], "en": "She leaves the studio without anyone seeing her.", "id": "p13e3i1", "full": "Elle sort de l'atelier sans qu'on la voie.", "audio": "a17c36376c7"}, {"q": "Il prend mon crayon mais je ne le sais pas.", "a": ["Il prend mon crayon sans que je le sache."], "en": "He takes my pencil without me knowing.", "id": "p13e3i2", "full": "Il prend mon crayon sans que je le sache.", "audio": "a2b67a16279"}, {"q": "L'expérience rate mais le professeur ne comprend pas pourquoi.", "a": ["L'expérience rate sans que le professeur comprenne pourquoi."], "en": "The experiment fails without the teacher understanding why.", "id": "p13e3i3", "full": "L'expérience rate sans que le professeur comprenne pourquoi.", "audio": "af39cf6db22"}], "id": "p13e3"}], "id": "p13"}, "p14": {"title": "Le subjonctif présent (2) : les emplois", "title_en": "The present subjunctive (2): when to use it", "rule": [["Le subjonctif s'emploie pour exprimer :", "The subjunctive is used to express:"], ["une **obligation** : il faut que · un **souhait** : vouloir que, aimer que · un **conseil** : il vaut mieux que · un **but** : pour que, afin que", "an **obligation**: il faut que · a **wish**: vouloir que, aimer que · **advice**: il vaut mieux que · a **purpose**: pour que, afin que (= so that)"], ["Il s'emploie aussi après **adjectif + que** : il est normal que, il est important que…", "It is also used after **adjective + que**: it's normal that, it's important that…"]], "box": {"title": "Un sujet ou deux sujets ? · One subject or two?", "lines": [["**Deux sujets différents** → que + subjonctif : Mes parents voudraient que **je devienne** médecin.", "**Two different subjects** → que + subjunctive: My parents would like me to become a doctor."], ["**Un seul sujet** → infinitif : Je voudrais **devenir** sculptrice.", "**One subject** → infinitive: I'd like to become a sculptor."]]}, "ex": [["Mes parents voudraient que je **sois** médecin.", "My parents would like me to be a doctor.", "a53687540fc"], ["Il vaut mieux que tu **choisisses** une filière scientifique.", "You'd better choose a science stream.", "a8a3b8ced37"], ["Le professeur explique deux fois pour que nous **comprenions**.", "The teacher explains twice so that we understand.", "ad95565ae61"], ["Il est normal que tu **hésites**.", "It's normal that you're hesitating.", "a500239d27d"]], "exercises": [{"type": "choose", "title": "Infinitif ou subjonctif ?", "title_en": "Infinitive or subjunctive?", "c": "Lilac, choisis la bonne forme du verbe.", "c_en": "Lilac, choose the right form of the verb.", "items": [{"q": "Je voudrais ___ architecte.", "opts": ["devenir", "que je devienne"], "a": [0], "en": "I'd like to become an architect.", "id": "p14e1i1", "full": "Je voudrais devenir architecte.", "audio": "ab47e721afe"}, {"q": "Ma mère voudrait que je ___ des études de sciences.", "opts": ["fais", "fasse", "faire"], "a": [1], "en": "My mother would like me to study science.", "id": "p14e1i2", "full": "Ma mère voudrait que je fasse des études de sciences.", "audio": "a712350e5b1"}, {"q": "Il est important que tu ___ ce que tu aimes.", "opts": ["choisis", "choisisses", "choisir"], "a": [1], "en": "It's important that you choose what you love.", "id": "p14e1i3", "full": "Il est important que tu choisisses ce que tu aimes.", "audio": "a5adff3c045"}, {"q": "Mon prof d'arts parle lentement pour que nous ___ tout.", "opts": ["comprenons", "comprenions", "comprendre"], "a": [1], "en": "My art teacher speaks slowly so that we understand everything.", "id": "p14e1i4", "full": "Mon prof d'arts parle lentement pour que nous comprenions tout.", "audio": "af9b9ffb092"}, {"q": "Pour ___ archéologue, il faut étudier l'histoire.", "opts": ["devenir", "que je devienne"], "a": [0], "en": "To become an archaeologist, you have to study history.", "id": "p14e1i5", "full": "Pour devenir archéologue, il faut étudier l'histoire.", "audio": "a694b61934b"}, {"q": "J'aimerais que mes parents ___ à mon exposition.", "opts": ["viennent", "venir", "viendront"], "a": [0], "en": "I'd like my parents to come to my exhibition.", "id": "p14e1i6", "full": "J'aimerais que mes parents viennent à mon exposition.", "audio": "a70b1c6763a"}], "id": "p14e1"}, {"type": "qcm", "title": "Pourquoi le subjonctif ?", "title_en": "Why the subjunctive?", "c": "Lilac, dis ce qu'exprime chaque phrase.", "c_en": "Lilac, say what each sentence expresses.", "items": [{"q": "Il faut que tu rendes ton dossier d'art lundi.", "opts": ["obligation", "souhait", "conseil", "but"], "a": [0], "en": "You must hand in your art portfolio on Monday.", "id": "p14e2i1", "full": "Il faut que tu rendes ton dossier d'art lundi.", "audio": "a82975a928c"}, {"q": "Je voudrais que tu viennes au planétarium avec moi.", "opts": ["obligation", "souhait", "conseil", "but"], "a": [1], "en": "I'd like you to come to the planetarium with me.", "id": "p14e2i2", "full": "Je voudrais que tu viennes au planétarium avec moi.", "audio": "abfc409a36e"}, {"q": "Il vaut mieux que tu fasses un stage avant de choisir.", "opts": ["obligation", "souhait", "conseil", "but"], "a": [2], "en": "You'd better do an internship before choosing.", "id": "p14e2i3", "full": "Il vaut mieux que tu fasses un stage avant de choisir.", "audio": "ad65b5502dc"}, {"q": "J'envoie mes dessins au concours afin que le jury les voie.", "opts": ["obligation", "souhait", "conseil", "but"], "a": [3], "en": "I'm sending my drawings to the competition so that the jury can see them.", "id": "p14e2i4", "full": "J'envoie mes dessins au concours afin que le jury les voie.", "audio": "ac181af7871"}], "id": "p14e2"}], "id": "p14"}, "p15": {"title": "Le passé simple (notions)", "title_en": "The passé simple (simple past – basics)", "img": "x4.jpg", "rule": [["Dans la **langue écrite**, on utilise parfois le passé simple à la place du passé composé : romans, biographies, récits historiques.", "In **written French**, the passé simple is sometimes used instead of the passé composé: novels, biographies, historical accounts."], ["Il faut surtout savoir le **reconnaître**, surtout à la 3ᵉ personne.", "You mainly need to **recognise** it, especially in the 3rd person."]], "table": {"head": ["Verbes en -er", "Verbes en -ir / -re", "Verbes en -oir, être, avoir…"], "rows": [["il parl**a** · ils parl**èrent**", "il fin**it** · ils fin**irent**", "il **fut** · ils **furent** (être)"], ["il dessin**a** · ils dessin**èrent**", "il pr**it** · ils pr**irent** (prendre)", "il **eut** · ils **eurent** (avoir)"], ["il entr**a** · ils entr**èrent**", "il **fit** (faire) · il **peignit** (peindre)", "il **put** (pouvoir) · il **reçut** (recevoir)"]]}, "box": {"title": "À reconnaître · To recognise", "lines": [["naître → il **naquit** · mourir → il **mourut** · venir → il **vint** · devenir → il **devint**", "to be born → naquit · to die → mourut · to come → vint · to become → devint"]]}, "ex": [["Picasso **naquit** en 1881 à Malaga. = Picasso est né en 1881.", "Picasso was born in 1881 in Málaga.", "a67ebeeeefc"], ["Il **devint** très célèbre. = Il est devenu très célèbre.", "He became very famous.", "a61e0de92f1"], ["Marie Curie **reçut** deux prix Nobel. = Elle a reçu deux prix Nobel.", "Marie Curie received two Nobel Prizes.", "aadecf5f834"], ["Les impressionnistes **peignirent** la lumière. = Ils ont peint la lumière.", "The Impressionists painted light.", "afe5cbd4ad2"]], "exercises": [{"type": "match", "title": "Retrouve l'infinitif", "title_en": "Find the infinitive", "c": "Lilac, associe chaque verbe au passé simple à son infinitif.", "c_en": "Lilac, match each verb in the passé simple with its infinitive.", "pairs": [["il fut", "être"], ["il eut", "avoir"], ["il fit", "faire"], ["il naquit", "naître"], ["il mourut", "mourir"], ["il peignit", "peindre"], ["il vint", "venir"], ["il devint", "devenir"]], "id": "p15e1", "rorder": [0, 4, 2, 1, 5, 7, 3, 6]}, {"type": "fill", "title": "La vie de Camille Claudel", "title_en": "The life of Camille Claudel", "c": "Lilac, réécris le verbe au passé composé.", "c_en": "Lilac, rewrite the verb in the passé composé.", "items": [{"q": "Camille Claudel ___ en 1864 dans l'Aisne.", "hint": "naquit", "a": ["est née"], "en": "Camille Claudel was born in 1864 in the Aisne region.", "id": "p15e2i1", "full": "Camille Claudel est née en 1864 dans l'Aisne.", "audio": "a9263613435"}, {"q": "Elle ___ dans l'atelier de Rodin en 1884.", "hint": "entra", "a": ["est entrée"], "en": "She joined Rodin's studio in 1884.", "id": "p15e2i2", "full": "Elle est entrée dans l'atelier de Rodin en 1884.", "audio": "a6d4595b4ec"}, {"q": "Elle ___ « La Valse », une sculpture célèbre.", "hint": "sculpta", "a": ["a sculpté"], "en": "She sculpted \"The Waltz\", a famous sculpture.", "id": "p15e2i3", "full": "Elle a sculpté « La Valse », une sculpture célèbre.", "audio": "ae05da81009"}, {"q": "Elle ___ un immense talent.", "hint": "eut", "a": ["a eu"], "en": "She had immense talent.", "id": "p15e2i4", "full": "Elle a eu un immense talent.", "audio": "a880ef28948"}, {"q": "Elle ___ en 1943.", "hint": "mourut", "a": ["est morte"], "en": "She died in 1943.", "id": "p15e2i5", "full": "Elle est morte en 1943.", "audio": "aa5c8020997"}], "id": "p15e2"}], "id": "p15"}, "p16": {"title": "Le discours indirect au présent", "title_en": "Reported speech (present)", "rule": [["On rapporte les paroles de quelqu'un avec un verbe au présent : **dire, demander, répondre, expliquer**…", "You report someone's words with a verb in the present: **to say, to ask, to answer, to explain**…"], ["Les **pronoms** et les **possessifs** changent : « je » → il/elle, « mon » → son…", "**Pronouns** and **possessives** change: \"I\" → he/she, \"my\" → his/her…"], ["Le **temps** des verbes ne change pas.", "The **tense** of the verbs doesn't change."]], "table": {"head": ["Paroles · Words", "Discours indirect · Reported"], "rows": [["phrase affirmative", "dit **que** …"], ["question oui / non", "demande **si** …"], ["qu'est-ce que…", "demande **ce que** …"], ["qu'est-ce qui…", "demande **ce qui** …"], ["où, quand, comment…", "demande **où, quand, comment** …"], ["impératif : Fais…!", "dit **de** + infinitif"]]}, "ex": [["Lilac dit : « J'adore la sculpture. » → Lilac dit **qu'elle** adore la sculpture.", "Lilac says that she loves sculpture.", "a429b6ef139"], ["Le prof demande aux élèves : « Vous avez fini ? » → Il leur demande **s'ils** ont fini.", "He asks them if they've finished.", "afcdcde5a4b"], ["Ma mère me demande : « Qu'est-ce que tu veux faire plus tard ? » → Elle me demande **ce que** je veux faire plus tard.", "She asks me what I want to do later.", "ad3c8651062"], ["La guide nous dit : « Ne touchez pas les œuvres ! » → Elle nous dit **de ne pas toucher** les œuvres.", "She tells us not to touch the works.", "ab51dad1f22"]], "exercises": [{"type": "choose", "title": "Le bon mot", "title_en": "The right word", "c": "Lilac, choisis le mot qui convient.", "c_en": "Lilac, choose the right word.", "items": [{"q": "Le guide dit : « Le musée ferme à 18 heures. » → Le guide dit ___ le musée ferme à 18 heures.", "opts": ["que", "si", "ce que"], "a": [0], "en": "The guide says that the museum closes at 6 p.m.", "id": "p16e1i1", "full": "Le guide dit que le musée ferme à 18 heures.", "audio": "a7464883d44"}, {"q": "Léa me demande : « Tu viens à l'atelier ? » → Léa me demande ___ je viens à l'atelier.", "opts": ["que", "si", "ce qui"], "a": [1], "en": "Léa asks me if I'm coming to the studio.", "id": "p16e1i2", "full": "Léa me demande si je viens à l'atelier.", "audio": "ad40877babe"}, {"q": "La conseillère me demande : « Qu'est-ce qui t'intéresse ? » → Elle me demande ___ m'intéresse.", "opts": ["ce que", "ce qui", "si"], "a": [1], "en": "She asks me what interests me.", "id": "p16e1i3", "full": "Elle me demande ce qui m'intéresse.", "audio": "a8989845f84"}, {"q": "Le prof nous dit : « Rangez les pinceaux ! » → Le prof nous dit ___ ranger les pinceaux.", "opts": ["que", "de", "si"], "a": [1], "en": "The teacher tells us to put the brushes away.", "id": "p16e1i4", "full": "Le prof nous dit de ranger les pinceaux.", "audio": "a475f51e920"}, {"q": "Mon père me demande : « Où est ton carnet ? » → Il me demande ___ est mon carnet.", "opts": ["où", "si", "ce qui"], "a": [0], "en": "He asks me where my sketchbook is.", "id": "p16e1i5", "full": "Il me demande où est mon carnet.", "audio": "a89c11905fc"}, {"q": "Ma grand-mère me demande : « Qu'est-ce que tu dessines ? » → Elle me demande ___ je dessine.", "opts": ["ce qui", "ce que", "que"], "a": [1], "en": "She asks me what I'm drawing.", "id": "p16e1i6", "full": "Elle me demande ce que je dessine.", "audio": "a290de4bc3c"}], "id": "p16e1"}, {"type": "transform", "title": "Rapporte les paroles", "title_en": "Report the words", "c": "Lilac, écris la phrase au discours indirect. Le début est donné.", "c_en": "Lilac, write the sentence in reported speech. The beginning is given.", "items": [{"q": "Lilac dit : « Je veux étudier les arts. »", "lead": "Lilac dit…", "a": ["Lilac dit qu'elle veut étudier les arts."], "en": "Lilac says that she wants to study art.", "id": "p16e2i1", "full": "Lilac dit qu'elle veut étudier les arts.", "audio": "a0239a23ccc"}, {"q": "Le scientifique demande aux élèves : « Est-ce que vous avez des questions ? »", "lead": "Le scientifique demande aux élèves…", "a": ["Le scientifique demande aux élèves s'ils ont des questions."], "en": "The scientist asks the pupils if they have any questions.", "id": "p16e2i2", "full": "Le scientifique demande aux élèves s'ils ont des questions.", "audio": "a5be0a81a07"}, {"q": "Ma prof me dit : « Montre-moi ton dessin. »", "lead": "Ma prof me dit…", "a": ["Ma prof me dit de lui montrer mon dessin."], "en": "My teacher tells me to show her my drawing.", "id": "p16e2i3", "full": "Ma prof me dit de lui montrer mon dessin.", "audio": "ad6d31c44fd"}], "id": "p16e2"}], "id": "p16"}, "p17": {"title": "Opinion, doute, certitude : subjonctif ou indicatif ?", "title_en": "Opinion, doubt, certainty: subjunctive or indicative?", "img": "x2.jpg", "rule": [["**Opinion négative, doute, possibilité** → **subjonctif** : je ne pense pas que, je ne crois pas que, je doute que, il est possible que, il se peut que.", "**Negative opinion, doubt, possibility** → **subjunctive**: I don't think that, I doubt that, it's possible that, it may be that."], ["**Opinion positive, certitude** → **indicatif** : je pense que, je crois que, je suis sûr(e) que.", "**Positive opinion, certainty** → **indicative**: I think that, I believe that, I'm sure that."]], "formula": ["je pense que + indicatif ≠ je ne pense pas que + subjonctif", "I think (indicative) ≠ I don't think (subjunctive)"], "ex": [["Je pense que les robots **peindront** un jour.", "I think robots will paint one day.", "adf0afde78b"], ["Je ne pense pas que les robots **puissent** remplacer les artistes.", "I don't think robots can replace artists.", "ad0a4495555"], ["Je doute que cette expérience **soit** facile.", "I doubt this experiment is easy.", "ae8bcedbd1e"], ["Il se peut qu'on **découvre** une nouvelle planète.", "We may discover a new planet.", "a2e958557f8"]], "exercises": [{"type": "choose", "title": "Indicatif ou subjonctif ?", "title_en": "Indicative or subjunctive?", "c": "Lilac, choisis la bonne forme du verbe.", "c_en": "Lilac, choose the right form of the verb.", "items": [{"q": "Je suis sûre que l'art ___ toujours important.", "opts": ["sera", "soit"], "a": [0], "en": "I'm sure art will always be important.", "id": "p17e1i1", "full": "Je suis sûre que l'art sera toujours important.", "audio": "a5fafdddd63"}, {"q": "Je doute que les humains ___ sur Mars avant 2040.", "opts": ["vivront", "vivent"], "a": [1], "en": "I doubt humans will live on Mars before 2040.", "id": "p17e1i2", "full": "Je doute que les humains vivent sur Mars avant 2040.", "audio": "abdd437b49c"}, {"q": "Il est possible que les musées ___ virtuels.", "opts": ["deviendront", "deviennent"], "a": [1], "en": "Museums may become virtual.", "id": "p17e1i3", "full": "Il est possible que les musées deviennent virtuels.", "audio": "a531eb63eb8"}, {"q": "Je crois que la science ___ aider la planète.", "opts": ["peut", "puisse"], "a": [0], "en": "I believe science can help the planet.", "id": "p17e1i4", "full": "Je crois que la science peut aider la planète.", "audio": "ad01919deab"}, {"q": "Je ne pense pas que ce tableau ___ très cher.", "opts": ["est", "soit"], "a": [1], "en": "I don't think this painting is very expensive.", "id": "p17e1i5", "full": "Je ne pense pas que ce tableau soit très cher.", "audio": "aba977c4820"}, {"q": "Il se peut qu'il ___ beau demain pour la sortie.", "opts": ["fait", "fasse"], "a": [1], "en": "The weather may be nice tomorrow for the outing.", "id": "p17e1i6", "full": "Il se peut qu'il fasse beau demain pour la sortie.", "audio": "a3789cb823f"}], "id": "p17e1"}], "id": "p17"}, "p18": {"title": "Les pronoms possessifs", "title_en": "Possessive pronouns", "rule": [["Ils remplacent un **nom** et indiquent le **possesseur**.", "They replace a **noun** and show **who owns it** (mine, yours…)."], ["Ils s'accordent avec l'**objet possédé** (masculin, féminin, singulier, pluriel).", "They agree with the **thing owned** (masculine, feminine, singular, plural)."]], "table": {"head": ["", "masc. sing.", "fém. sing.", "masc. plur.", "fém. plur."], "rows": [["à moi", "le mien", "la mienne", "les miens", "les miennes"], ["à toi", "le tien", "la tienne", "les tiens", "les tiennes"], ["à lui / à elle", "le sien", "la sienne", "les siens", "les siennes"], ["à nous", "le nôtre", "la nôtre", "les nôtres", "les nôtres"], ["à vous", "le vôtre", "la vôtre", "les vôtres", "les vôtres"], ["à eux / à elles", "le leur", "la leur", "les leurs", "les leurs"]], "audio": [["", "a6896965746", "a7bb0f2f891", "a1bb2b9db40", "aeecce7146a"], ["", "ac802a6c948", "a26c9c968ab", "accaa4e5aba", "af5deff6434"], ["", "a560802bdb9", "a9506fe5fc3", "aae862b601b", "a4f8b98de5f"], ["", "a0d7b929894", "a885cd8e488", "a9e636821c2", "a9e636821c2"], ["", "aeb7f387c85", "a243eed6df0", "ab6f2a9e224", "ab6f2a9e224"], ["", "a2330dc02fe", "add23156617", "aa38b5bae9c", "aa38b5bae9c"]]}, "box": {"title": "Attention · Watch out", "lines": [["à + le mien = **au mien** · de + le mien = **du mien** · de + les nôtres = **des nôtres**", "à + le → au · de + le → du · de + les → des"]]}, "ex": [["Ce n'est pas mon pinceau, c'est **le tien**.", "It's not my brush, it's yours.", "a414245dcfd"], ["Ta sculpture est grande ; **la mienne** est petite.", "Your sculpture is big; mine is small.", "a46eaa12810"], ["Nos idées sont originales, mais **les leurs** sont géniales.", "Our ideas are original, but theirs are brilliant.", "a73336bb60b"], ["Tu as besoin de ton carnet ? Moi, j'ai besoin **du mien**.", "Do you need your sketchbook? I need mine.", "a891516099d"]], "exercises": [{"type": "choose", "title": "À qui est-ce ?", "title_en": "Whose is it?", "c": "Lilac, choisis le bon pronom possessif.", "c_en": "Lilac, choose the right possessive pronoun.", "items": [{"q": "C'est ton carnet de croquis ? — Oui, c'est ___ .", "opts": ["le mien", "la mienne", "les miens"], "a": [0], "en": "Is it your sketchbook? — Yes, it's mine.", "id": "p18e1i1", "full": "C'est ton carnet de croquis ? Oui, c'est le mien.", "audio": "a43f2d04f0c"}, {"q": "Ce sont tes peintures ? — Non, ce ne sont pas ___ .", "opts": ["les miens", "les miennes", "la mienne"], "a": [1], "en": "Are these your paintings? — No, they're not mine.", "id": "p18e1i2", "full": "Ce sont tes peintures ? Non, ce ne sont pas les miennes.", "audio": "a749c34bc89"}, {"q": "Ma sculpture est en bois. Et ___ , Paul ?", "opts": ["le tien", "la tienne", "les tiennes"], "a": [1], "en": "My sculpture is made of wood. And yours, Paul?", "id": "p18e1i3", "full": "Ma sculpture est en bois. Et la tienne, Paul ?", "audio": "aa0ad6408e2"}, {"q": "Notre projet de sciences est prêt. Et ___ , les filles ?", "opts": ["le vôtre", "la vôtre", "les vôtres"], "a": [0], "en": "Our science project is ready. And yours, girls?", "id": "p18e1i4", "full": "Notre projet de sciences est prêt. Et le vôtre, les filles ?", "audio": "a481e6ea041"}, {"q": "Ils parlent de leurs idées, nous parlons ___ .", "opts": ["les nôtres", "des nôtres", "du nôtre"], "a": [1], "en": "They talk about
