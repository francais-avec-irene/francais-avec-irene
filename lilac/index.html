    let ans = x.type==="fill" ? it.a[0] : x.type==="choose"||x.type==="qcm" ? it.opts[it.a[0]] : x.type==="transform" ? it.a[0] : it.a;
    UNITS.push({id:it.id, pid:p.id, exo:x.id, q: x.type==="order" ? it.words.join(" / ") : strip(it.q), answer: x.type==="fill"||x.type==="choose" ? it.full : ans});
    h += `<div class="item" id="${it.id}" data-t="${x.type}">`;
    if (x.type === "fill"){
      const w = Math.max(5, it.a[0].length + 2);
      h += `<div class="q">${md(it.q).replace("___", `<input class="inp" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false">`)} ${it.hint?`<span class="hint">(${esc(it.hint)})</span>`:""}</div>`;
      h += `<div class="row"><button class="btn chk">Vérifier · Check</button><button class="btn ghost entg">EN</button><button class="snd hid" data-a="${it.audio}">🔊</button></div>`;
    } else if (x.type === "choose" || x.type === "qcm"){
      h += `<div class="q">${x.type==="choose" ? md(it.q).replace("___", `<span class="gap">…</span>`) : md(it.q)}</div><div class="row">`;
      it.opts.forEach((o, oi) => h += `<button class="opt" data-o="${oi}">${esc(o)}${OPT_EN[o]?`<small>${esc(OPT_EN[o])}</small>`:""}</button>`);
      h += `<button class="btn ghost entg">EN</button><button class="snd hid" data-a="${it.audio}">🔊</button></div>`;
    } else if (x.type === "transform"){
      h += `<div class="q">${md(it.q)}</div>${it.lead?`<span class="lead">Commence par · Start with : <b>${esc(it.lead)}</b></span>`:""}<input class="tr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Écris ta phrase ici · Write your sentence here">`;
      h += `<div class="row"><button class="btn chk">Vérifier · Check</button><button class="btn ghost entg">EN</button><button class="snd hid" data-a="${it.audio}">🔊</button></div>`;
    } else if (x.type === "order"){
      h += `<div class="chips bank">${it.words.map((w,wi)=>`<button class="chip" data-w="${wi}">${esc(w)}</button>`).join("")}</div><div class="chips zone"></div>`;
      h += `<div class="row"><button class="btn chk" disabled>Vérifier · Check</button><button class="btn ghost undo">↺</button><button class="btn ghost entg">EN</button><button class="snd hid" data-a="${it.audio}">🔊</button></div>`;
    }
    h += `<div class="fb"></div><div class="tren en">${esc(it.en)}</div></div>`;
  });
  return h + `</div></div>`;
}
// ---------- lookups
const ITEM = {}, EXO = {};
D.modules.forEach(m => m.points.forEach(pid => { const p = D.points[pid]; p.exercises.forEach(x => { EXO[x.id] = {x, p}; if (x.items) x.items.forEach(it => ITEM[it.id] = {it, x, p}); }); }));
// ---------- apply result to DOM
function showResult(id, rec, fresh){
  const {it, x} = ITEM[id]; const el = document.getElementById(id); if (!el) return;
  const fb = el.querySelector(".fb"); const ok = rec.ok;
  el.querySelectorAll("input,.opt,.chip,.chk,.undo").forEach(b => b.disabled = true);
  if (x.type === "fill"){ const inp = el.querySelector("input"); inp.value = rec.val; inp.classList.add(ok?"good":"bad"); }
  if (x.type === "transform"){ const inp = el.querySelector("input"); inp.value = rec.val; inp.classList.add(ok?"good":"bad"); }
  if (x.type === "choose" || x.type === "qcm"){
    el.querySelectorAll(".opt").forEach(b => { const o = +b.dataset.o; if (it.a.includes(o) && (ok ? o===rec.val : o===it.a[0])) b.classList.add("good"); if (!ok && o === rec.val) b.classList.add("bad"); });
    if (x.type === "choose"){ const g = el.querySelector(".gap"); g.textContent = it.opts[ok?rec.val:it.a[0]] === "—" ? "∅" : it.opts[ok?rec.val:it.a[0]]; }
  }
  if (x.type === "order"){ const z = el.querySelector(".zone"), b = el.querySelector(".bank"); z.innerHTML = (rec.val||"").split(" ").filter(Boolean).map(w=>`<span class="chip">${esc(w)}</span>`).join(""); b.innerHTML = ""; }
  let msg = ok ? `✓ Correct !` : `✗ La bonne réponse · The right answer : <b>${esc(it.full)}</b>`;
  if (ok && rec.acc) msg += ` <span class="why">Attention aux accents · Watch the accents : <b>${esc(it.full)}</b></span>`;
  if (!ok && it.why) msg += `<span class="why">${esc(it.why)}</span>`;
  fb.className = "fb " + (ok ? "ok" : "ko"); fb.innerHTML = msg;
  el.querySelector(".tren").classList.add("show");
  el.querySelector(".snd").classList.remove("hid");
  if (fresh){ if (ok) stars(el.querySelector(".fb")); play(it.audio); }
}
function record(id, rec){ S[id] = rec; save(); showResult(id, rec, true); refresh(); }
// ---------- events
document.addEventListener("click", e => {
  const t = e.target.closest("button,td.say"); if (!t) return;
  if (t.matches(".snd,td.say")) { play(t.dataset.a); return; }
  const item = t.closest(".item");
  if (t.matches(".entg") && item){ item.querySelector(".tren").classList.toggle("show"); return; }
  if (t.matches(".opt") && item && !S[item.id]){ const {it} = ITEM[item.id]; const o = +t.dataset.o; record(item.id, {ok: it.a.includes(o), val:o}); return; }
  if (t.matches(".chk") && item && !S[item.id]){
    const {it, x} = ITEM[item.id];
    if (x.type === "fill" || x.type === "transform"){ const v = item.querySelector("input").value; if (!v.trim()) return; const j = judge(v, it.a); record(item.id, {ok: j!=="ko", acc: j==="acc", val: v}); }
    if (x.type === "order"){ const v = [...item.querySelectorAll(".zone .chip")].map(c=>c.textContent).join(" "); const ok = norm(v) === norm(it.a); record(item.id, {ok, val: v + (it.punct||"")}); }
    return;
  }
  if (t.matches(".chip") && item && !S[item.id]){
    const z = item.querySelector(".zone"), b = item.querySelector(".bank");
    if (t.parentElement === b) z.appendChild(t); else b.appendChild(t);
    item.querySelector(".chk").disabled = b.children.length > 0; return;
  }
  if (t.matches(".undo") && item && !S[item.id]){ const z = item.querySelector(".zone"), b = item.querySelector(".bank"); [...z.children].forEach(c => b.appendChild(c)); item.querySelector(".chk").disabled = true; return; }
  if (t.matches(".mi")) { matchClick(t); return; }
  if (t.matches("#resetbtn")){ if (t.dataset.sure){ S = {}; save(); location.reload(); } else { t.dataset.sure = 1; t.textContent = "Sûre ? Touche encore · Sure? Tap again"; } return; }
  if (t.closest("#acc")){ const a = document.activeElement; if (a && a.tagName === "INPUT"){ const s = a.selectionStart, en = a.selectionEnd; a.value = a.value.slice(0,s) + t.textContent + a.value.slice(en); a.selectionStart = a.selectionEnd = s + t.textContent.length; } return; }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input")){ const c = e.target.closest(".item").querySelector(".chk"); if (c) c.click(); } });
// accent bar
const ACC = ["é","è","ê","ë","à","â","ç","î","ï","ô","ù","û","œ","'"];
const accEl = document.getElementById("acc");
accEl.innerHTML = ACC.map(c => `<button type="button">${c}</button>`).join("");
accEl.addEventListener("mousedown", e => e.preventDefault());
accEl.addEventListener("touchstart", e => { if (e.target.tagName === "BUTTON"){ e.preventDefault(); e.target.click(); } }, {passive:false});
document.addEventListener("focusin", e => { if (e.target.matches("input")) accEl.classList.add("on"); });
document.addEventListener("focusout", e => { setTimeout(() => { if (!document.activeElement || !document.activeElement.matches("input")) accEl.classList.remove("on"); }, 120); });
// matching
let SEL = {};
function matchClick(b){
  const box = b.closest(".match"), xid = box.dataset.x; const {x} = EXO[xid]; const i = +b.dataset.i;
  if (b.classList.contains("done")) return;
  if (b.classList.contains("L")){ box.querySelectorAll(".L").forEach(z => z.classList.remove("sel")); b.classList.add("sel"); SEL[xid] = i; return; }
  if (SEL[xid] === undefined) { b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"), 400); return; }
  const li = SEL[xid], uid = `${xid}m${li}`;
  const L = box.querySelector(`.L[data-i="${li}"]`);
  if (i === li){
    const rec = S[uid] || {}; rec.done = 1; if (rec.ok === undefined) rec.ok = true; S[uid] = rec; save();
    markMatch(box, li, rec); if (rec.ok) stars(b); delete SEL[xid]; refresh();
  } else {
    b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"), 400);
    if (!S[uid]) { S[uid] = {ok:false}; save(); refresh(); }
  }
}
function markMatch(box, i, rec){ box.querySelectorAll(`[data-i="${i}"]`).forEach(z => { z.classList.remove("sel"); z.classList.add("done"); if (!rec.ok) z.classList.add("late"); }); }
// ---------- score + à revoir
function refresh(){
  let ok = 0; const wrong = [];
  UNITS.forEach(u => { const r = S[u.id]; if (!r) return; if (r.ok && (r.done || !u.id.includes("m") || ITEM[u.id])) ok++; if (r.ok === false) wrong.push(u); });
  // per exercise mini-scores
  Object.keys(EXO).forEach(xid => { const us = UNITS.filter(u => u.exo === xid); const g = us.filter(u => S[u.id] && S[u.id].ok && (ITEM[u.id] || S[u.id].done)).length; const m = document.getElementById("mini-"+xid); if (m) m.textContent = `${g} / ${us.length}`; });
  document.getElementById("sc").textContent = ok;
  document.getElementById("tot").textContent = UNITS.length;
  const answered = UNITS.filter(u => S[u.id] && (ITEM[u.id] ? true : S[u.id].done)).length;
  document.getElementById("pg").style.width = (100*answered/UNITS.length) + "%";
  document.getElementById("rvn").textContent = wrong.length;
  const L = document.getElementById("revlist");
  if (!wrong.length){ L.innerHTML = `<p class="empty">Pour l'instant, rien à revoir. · Nothing to review for now.</p>`; }
  else {
    let h = ""; const mcol = {}; D.modules.forEach(m => m.points.forEach(pid => mcol[pid] = m.color));
    wrong.forEach(u => { const p = D.points[u.pid];
      h += `<div class="rv" style="--c:${mcol[u.pid]}"><div class="t">Point ${p.n} · ${esc(p.title)}</div><div>${esc(u.q)}</div><div class="a">→ ${esc(u.answer)}</div><a href="#rule-${u.pid}">↑ Revoir la règle · Review the rule</a></div>`; });
    L.innerHTML = h;
  }
  if (!document.getElementById("resetbtn")) L.insertAdjacentHTML("afterend", `<div style="padding:0 18px 18px"><button class="btn ghost reset" id="resetbtn" style="--c:#6c4ee0">Recommencer à zéro · Start again</button></div>`);
}
// ---------- init
render();
Object.keys(S).forEach(id => { if (ITEM[id]) showResult(id, S[id], false); });
document.querySelectorAll(".match").forEach(box => { const xid = box.dataset.x; EXO[xid].x.pairs.forEach((p,i) => { const r = S[`${xid}m${i}`]; if (r && r.done) markMatch(box, i, r); }); });
refresh();
// ---------- envoi des résultats
(function(){
  const b=document.getElementById("sendbtn"),st=document.getElementById("sendst"),nm=document.getElementById("sname"),SK=KEY+"-sent";
  if(!b) return;
  let last=null; try{ last=localStorage.getItem(SK); }catch(e){}
  if(last){ st.className="st ok"; st.textContent="Résultats déjà envoyés le "+last+". · Already sent. You can send them again."; }
  b.onclick=async()=>{
    let ok=0; const wrong=[];
    UNITS.forEach(u=>{ const r=S[u.id]; if(!r) return; if(r.ok && (r.done || !u.id.includes("m") || ITEM[u.id])) ok++; if(r.ok===false) wrong.push(u); });
    const done=UNITS.filter(u=>S[u.id] && (ITEM[u.id] ? true : S[u.id].done)).length;
    const lines=wrong.map(u=>{ const p=D.points[u.pid]; return "• Point "+p.n+" · "+p.title+"\n   "+u.q+"\n   → "+u.answer; });
    const name=(nm.value||"").trim()||"Élève";
    const data={access_key:"e554b1d0-2dda-40a0-b94b-f833d9d5fad6",subject:"Résultats de "+name+" · Grande révision de grammaire",from_name:"Le français avec Irène",
      "Élève":name,"Leçon":"Lilac · Grande révision de grammaire","Score":ok+" / "+UNITS.length,"Questions faites":done+" / "+UNITS.length,
      "À revoir":lines.length?lines.join("\n"):"Rien à revoir 🎉"};
    b.disabled=true; const lbl=b.textContent; b.textContent="Envoi en cours… · Sending…"; st.className="st"; st.textContent="";
    try{
      const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)});
      const j=await r.json(); if(!j.success) throw new Error(j.message||"erreur");
      const d=new Date(), t=d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
      try{ localStorage.setItem(SK,t); }catch(e){}
      st.className="st ok"; st.textContent="Merci ! Irène a bien reçu tes résultats. · Thank you! Irène has received your results.";
    }catch(e){ st.className="st ko"; st.textContent="L'envoi n'a pas marché. Vérifie ta connexion et réessaie. · Sending failed. Check your connection and try again."; }
    b.disabled=false; b.textContent=lbl;
  };
})();
