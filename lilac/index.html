<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grande révision de grammaire · Lilac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#24223a;--muted:#6f6c86;--line:#e7e4f2;--bg:#faf8ff;--ok:#1f9d6b;--okbg:#e6f7ef;--ko:#d6455b;--kobg:#fdecef;--gold:#f5b62a}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5}
h1,h2,h3,h4,.pop{font-family:Poppins,system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:6px 0}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font:600 13px Poppins;color:#fff;padding:6px 11px;border-radius:999px;white-space:nowrap}
.nav a.rev{background:#2b2840}
.score{flex:none;display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#ffcf4d,#f59b2a);color:#3a2500;font:800 16px Poppins;padding:7px 14px;border-radius:999px;box-shadow:0 3px 10px rgba(245,155,42,.35)}
.score small{font-weight:600;font-size:12px;opacity:.8}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e2557b,#6c4ee0,#1f78c8,#2e9e6a);transition:width .4s}
/* hero */
.hero{margin:18px auto 0;position:relative;border-radius:22px;overflow:hidden;height:300px;box-shadow:0 10px 30px rgba(40,30,90,.18)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .card{position:absolute;left:18px;bottom:18px;right:18px;max-width:560px;background:rgba(255,255,255,.94);border-radius:16px;padding:14px 18px}
.tag{display:inline-block;font:700 11px Poppins;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,#e2557b,#6c4ee0);padding:4px 10px;border-radius:999px}
.hero h1{margin:8px 0 2px;font-size:30px;line-height:1.15}
.hero .en{color:var(--muted);font-style:italic}
.rainbow{height:5px;border-radius:5px;margin:14px 0;background:linear-gradient(90deg,#e2557b,#f08a24,#f6c445,#2e9e6a,#1f78c8,#6c4ee0)}
.intro{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin:6px 0 10px}
.intro b{color:#6c4ee0}
.en{color:var(--muted);font-style:italic}
.intro ul{margin:8px 0 0;padding-left:20px}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin:14px 0 4px}
.mapgrid a{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:10px 14px;font-size:14px}
.mapgrid a b{font-family:Poppins;color:var(--c)}
/* modules */
.module{margin-top:44px}
.mban{position:relative;border-radius:22px;overflow:hidden;height:210px}
.mban img{width:100%;height:100%;object-fit:cover;display:block}
.mban .lbl{position:absolute;left:16px;bottom:16px;background:#fff;border-radius:14px;padding:8px 16px 10px;border-left:7px solid var(--c);max-width:80%}
.mban .lbl small{font:700 11px Poppins;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.mban .lbl h2{margin:0;font-size:24px;line-height:1.2}
.point{background:#fff;border-radius:20px;margin:22px 0;box-shadow:0 4px 18px rgba(40,30,90,.07);overflow:hidden;border:1px solid var(--line)}
.phead{background:linear-gradient(120deg,var(--c),var(--c2));color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center}
.phead .n{font:800 30px Poppins;opacity:.9;min-width:44px}
.phead h3{margin:0;font-size:21px;line-height:1.2}
.phead .en{color:rgba(255,255,255,.9)}
.pbody{padding:18px 20px 8px}
.secttl{font:700 12px Poppins;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin:6px 0 8px}
.rule{background:color-mix(in srgb,var(--c) 7%,#fff);border:1.5px solid color-mix(in srgb,var(--c) 30%,#fff);border-radius:16px;padding:12px 16px;overflow:hidden}
.rule .pimg{float:right;width:170px;height:120px;object-fit:cover;border-radius:12px;border:4px solid #fff;box-shadow:0 0 0 2px var(--c);margin:2px 0 8px 14px}
.rl{margin:0 0 9px}.rl:last-child{margin-bottom:2px}
.rl .fr b,.ex .fr b,.box b,td b{color:var(--c)}
.rl .en,.ex .en,.box .en{display:block;font-size:15px}
.formula{display:inline-block;margin:10px 0 2px;padding:7px 16px;border-radius:999px;border:2px solid var(--c);background:#fff;font:600 15px Poppins;color:var(--c)}
.formula .en{font:italic 400 13px Nunito;margin-left:6px}
.tblw{overflow-x:auto;margin:12px 0 4px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:15px;background:#fff;border:1.5px solid color-mix(in srgb,var(--c) 30%,#fff);border-radius:12px;overflow:hidden}
th{background:color-mix(in srgb,var(--c) 14%,#fff);font:600 13px Poppins;text-align:left;padding:7px 10px;color:var(--ink)}
td{padding:6px 10px;border-top:1px solid var(--line)}
td.say{cursor:pointer}td.say:hover{background:color-mix(in srgb,var(--c) 8%,#fff)}
td.say::after{content:" 🔊";font-size:11px;opacity:.55}
.box{margin:12px 0 4px;background:#fff;border-left:5px solid var(--c2);border-radius:10px;padding:9px 14px;box-shadow:0 1px 0 var(--line)}
.box h4{margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--c2);filter:brightness(.8)}
.box p{margin:0 0 6px}
.exs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
.ex{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:10px 12px}
.ex .fr{font-weight:600}
.snd{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--c);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.snd:active{transform:scale(.92)}
/* exercises */
.exo{margin:18px 0 16px;border-radius:16px;border:1.5px solid var(--line);overflow:hidden}
.exh{padding:10px 16px;background:color-mix(in srgb,var(--c2) 18%,#fff);border-bottom:1.5px solid var(--line)}
.exh .num{font:800 12px Poppins;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.exh h4{margin:2px 0 4px;font-size:17px}
.exh .cons{font-weight:700}
.exh .cons .en{font-weight:400;display:block;font-size:15px}
.exh .mini{float:right;font:700 13px Poppins;color:var(--c);background:#fff;border-radius:999px;padding:3px 10px}
.items{padding:6px 14px 10px}
.item{padding:12px 4px;border-bottom:1px dashed var(--line);position:relative}
.item:last-child{border-bottom:0}
.item .q{font-size:17px}
.item .lead{display:inline-block;margin:4px 0;font-size:14px;color:var(--muted)}
.gap{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--c);text-align:center;font-weight:700;color:var(--c);padding:0 4px}
.hint{color:var(--muted);font-style:italic;font-size:15px}
input.inp,input.tr{font:600 17px Nunito;color:var(--ink);border:2px solid color-mix(in srgb,var(--c) 40%,#fff);border-radius:10px;padding:4px 8px;background:#fff;outline:none}
input.inp{width:9em;margin:2px 2px}
input.tr{width:100%;margin-top:6px}
input:focus{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
input.good{border-color:var(--ok);background:var(--okbg)}input.bad{border-color:var(--ko);background:var(--kobg);text-decoration:line-through}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.btn{font:700 14px Poppins;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:var(--c);color:#fff}
.btn.ghost{background:#fff;color:var(--c);border:2px solid color-mix(in srgb,var(--c) 40%,#fff);padding:6px 12px}
.btn:disabled{opacity:.4;cursor:default}
.opt{font:600 15px Nunito;border:2px solid color-mix(in srgb,var(--c) 35%,#fff);background:#fff;border-radius:12px;padding:7px 13px;cursor:pointer;color:var(--ink);text-align:left}
.opt small{display:block;font-style:italic;color:var(--muted);font-weight:400;font-size:12px}
.opt:hover{border-color:var(--c)}
.opt.good{border-color:var(--ok);background:var(--okbg);color:#0e5a3c}
.opt.bad{border-color:var(--ko);background:var(--kobg);color:#8a1d2e;text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{margin-top:7px;font-size:15px;border-radius:10px;padding:7px 11px;display:none}
.fb.ok{display:block;background:var(--okbg);color:#0e5a3c}
.fb.ko{display:block;background:var(--kobg);color:#7d1b2b}
.fb .why{display:block;font-size:14px;margin-top:3px}
.tren{display:none;margin-top:5px;font-size:15px}
.tren.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:7px;min-height:44px;padding:6px;border-radius:12px}
.zone{border:2px dashed color-mix(in srgb,var(--c) 40%,#fff);background:color-mix(in srgb,var(--c) 5%,#fff);margin-top:6px}
.chip{font:700 15px Nunito;padding:6px 12px;border-radius:10px;background:#fff;border:2px solid color-mix(in srgb,var(--c2) 60%,#fff);cursor:pointer;color:var(--ink)}
.zone .chip{background:var(--c);border-color:var(--c);color:#fff}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{font:700 15px Nunito;padding:9px 12px;border-radius:12px;border:2px solid color-mix(in srgb,var(--c) 35%,#fff);background:#fff;cursor:pointer;text-align:left;color:var(--ink)}
.mi.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.mi.done{border-color:var(--ok);background:var(--okbg);color:#0e5a3c;cursor:default}
.mi.done.late{border-color:#e9a23b;background:#fff5e3;color:#7a4b06}
.mi.shake{animation:shake .35s;border-color:var(--ko);background:var(--kobg)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.item .snd{width:32px;height:32px;font-size:14px}
.item .snd.hid{display:none}
/* stars */
.star{position:fixed;z-index:100;pointer-events:none;color:var(--gold);font-size:18px;animation:pop .9s ease-out forwards;text-shadow:0 0 6px rgba(245,182,42,.6)}
@keyframes pop{0%{transform:translate(0,0) scale(.3);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(70deg);opacity:0}}
/* envoi résultats */
.send{margin:0 18px 18px;padding:16px;border-radius:16px;background:#f4f1ff;border:1.5px solid #ddd5fb}
.send h3{margin:0 0 2px;color:#2b2840;font:700 17px Poppins}
.send p{margin:0 0 10px;font-size:14px;color:#5d5876}
.send label{display:block;font:700 13px Poppins;color:#2b2840;margin-bottom:4px}
.send input{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1.5px solid #ddd5fb;border-radius:12px;margin-bottom:12px;background:#fff}
.send .btn{width:100%;padding:12px 16px;font-size:15px}
.send .st{margin:10px 0 0;font-weight:600;font-size:14px}
.send .st.ok{color:#13704f}.send .st.ko{color:#b3261e}
/* à revoir */
#revoir{margin:50px 0 20px;background:#fff;border-radius:22px;border:1px solid var(--line);overflow:hidden}
#revoir .rh{background:#2b2840;color:#fff;padding:16px 20px}
#revoir .rh h2{margin:0;font-size:24px}
#revoir .rh .en{color:#c9c5e6}
#revlist{padding:10px 18px 16px}
.rv{border-left:5px solid var(--c);background:#faf9fe;border-radius:10px;padding:9px 13px;margin:10px 0}
.rv .t{font:700 12px Poppins;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.rv .a{color:#0e5a3c;font-weight:700}
.rv a{display:inline-block;margin-top:5px;font:700 13px Poppins;color:var(--c);text-decoration:none;border:2px solid color-mix(in srgb,var(--c) 40%,#fff);padding:3px 10px;border-radius:999px}
.empty{color:var(--muted);font-style:italic;padding:10px 0}
.reset{margin:16px 0 0}
.foot{text-align:center;color:var(--muted);font:600 13px Poppins;padding:20px 0 90px}
/* accents */
#acc{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#2b2840;padding:8px;display:none;justify-content:center;gap:6px;flex-wrap:wrap}
#acc.on{display:flex}
#acc button{font:700 17px Nunito;min-width:38px;height:38px;border-radius:9px;border:0;background:#fff;color:#2b2840;cursor:pointer}
@media (max-width:680px){
 body{font-size:16px}.exs{grid-template-columns:1fr}.hero{height:260px}.hero h1{font-size:23px}
 .rule .pimg{float:none;width:100%;height:150px;margin:0 0 10px}
 .match{grid-template-columns:1fr 1fr}.phead h3{font-size:18px}.mban{height:170px}.mban .lbl h2{font-size:19px}
}
</style>
</head>
