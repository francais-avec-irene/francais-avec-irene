const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function play(k){ if(!k) return; try { if (cur) cur.pause(); cur = new Audio("audio/"+k+".mp3"); cur.play().catch(()=>{}); } catch(e){} }
let actx=null;
function chime(good){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  (good?[659,880,1175,1568]:[330,262]).forEach((f,i)=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type=good?"sine":"triangle"; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+i*(good?.08:.14); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(good?.12:.07,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.35); o.start(t); o.stop(t+.4); }); }catch(e){} }
function whoosh(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.type="sine";
  const t=actx.currentTime; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(1200,t+.5); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.08,t+.1); g.gain.exponentialRampToValueAtTime(.0001,t+.55);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.6);}catch(e){} }
function stars(el){ const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; const sym=["⭐","✨","🌟","💖","⭐","✨","🌈","⭐","✨","🌟"];
  sym.forEach((s,i)=>{ const e=document.createElement("span"); e.className="star"; e.textContent=s; const a=Math.PI*2*i/sym.length, d=70+Math.random()*60;
  e.style.left=cx+"px"; e.style.top=cy+"px"; e.style.setProperty("--dx",Math.cos(a)*d+"px"); e.style.setProperty("--dy",Math.sin(a)*d-20+"px"); e.style.animationDelay=(i*25)+"ms"; document.body.appendChild(e); setTimeout(()=>e.remove(),1200); });
  const sc=document.getElementById("score"); sc.classList.add("bump"); setTimeout(()=>sc.classList.remove("bump"),250); }

/* ---------- scène : objet + petit personnage ---------- */
function scene(obj,pos,who,small){
  const W = who || "🐈";
  let o="";
  if(obj==="table") o=`<div class="tbl"><i class="tp"></i><i class="lg l1"></i><i class="lg l2"></i></div>`;
  else if(obj==="boite") o=`<div class="ob box"><i class="flap f1"></i><i class="flap f2"></i></div>`;
  else if(obj==="maison") o=`<div class="ob house">🏠</div>`;
  else if(obj==="chaises") o=`<div class="ob ch1">🪑</div><div class="ob ch2">🪑</div>`;
  else if(obj==="lit") o=`<div class="ob bed">🛏️</div>`;
  return `<div class="stage ${small?"sm":""} o-${obj} p-${pos}">${o}<div class="pet">${W}</div></div>`;
}

function mark(p, i, ok, el){ S.res[p+i]={ok}; save(); if(ok){ chime(true); stars(el); } else chime(false); refresh(); }

  let h = `<div class="card">${head(SC("rappel"))}<p style="margin:0 0 14px">Evelyn, écoute la règle, puis joue ! <span class="en">· Evelyn, listen to the rule, then play!</span></p>`;
  D.RULES.forEach(r=>{
    h += `<div class="rule" id="${r.id}" style="--c:${r.c}"><h3>${esc(r.t)} <span class="en">· ${esc(r.en)}</span></h3>`;
    if(r.places) h += `<div class="places">${r.places.map(p=>`<button class="place play2" data-a="${p.au}"><img src="img/${p.img}.jpg" alt=""><b>${esc(p.fr)}</b><span class="en">${esc(p.en)}</span></button>`).join("")}</div>`;
    if(r.preps) h += `<div class="preps">${r.preps.map(p=>`<button class="prep play2" data-a="${p.au}">${scene(p.obj,p.pos,null,true)}<b>${esc(p.w)}</b><span class="en">${esc(p.wen)}</span></button>`).join("")}</div>`;
    h += (r.lines||[]).map(l=>`<div class="rl"><button class="play" data-a="${l[2]}">🔊</button><div>${esc(l[0])}<span class="en">${esc(l[1])}</span></div></div>`).join("");
    h += `</div>`;
  });
  h += `<button class="next show" onclick="show('bulles')">On joue ! ▶ <span style="font-size:.7em">Let's play!</span></button></div>`;
  document.getElementById("sc-rappel").innerHTML = h; };

// ---------- Bulles
RENDER.bulles = () => { const i=S.idx.b, it=D.BULLES[i], r=S.res["b"+i]; const colors=["#9FD3FF","#FFC2D6","#C9F0C6"];
  const pos=[[8,90],[38,30],[68,100]];
  let h=`<div class="card">${head(SC("bulles"))}${instr("bulles")}${dots("b",D.BULLES.length,i)}
  <div class="sent">${it.pic?`<span class="pic-e">${it.pic}</span> `:""}${esc(it.s).replace("___",`<span class="gap" id="gp">${r? esc(it.a):"…"}</span>`)}</div><div class="tr en" id="tr">${r?esc(it.en):""}</div>
  <div class="sky"><span class="cloud" style="top:10px">☁️</span><span class="cloud" style="top:150px;animation-delay:-11s;font-size:44px">☁️</span>`;
  it.o.forEach((o,k)=>{ h+=`<button class="bub ${r&&o===it.a?"glow":""} ${r&&!r.ok&&o===r.c?"bad":""}" data-o="${esc(o)}" style="left:${pos[k][0]}%;top:${pos[k][1]}px;--bc:${colors[k]};--d:${3+k*.7}s;animation-delay:-${k}s" ${r?"disabled":""}>${esc(o)}</button>`; });
  h+=`</div><div class="fb ${r?(r.ok?"ok":"ko"):""}" id="fb">${r?(r.ok?"✓ Oui ! · Yes!":"✗ "+esc(it.full)):""}</div>${nextBtn("b",D.BULLES.length)}</div>`;
  const el=document.getElementById("sc-bulles"); el.innerHTML=h;
  el.querySelectorAll(".bub").forEach(b=>b.onclick=()=>{ if(S.res["b"+i]) return; const ok=b.dataset.o===it.a; S.res["b"+i]={ok,c:b.dataset.o};
    el.querySelectorAll(".bub").forEach(x=>x.disabled=true);
    if(ok){ b.classList.add("popit"); } else { b.classList.add("bad"); el.querySelector(`.bub[data-o="${it.a}"]`).classList.add("glow"); }
    document.getElementById("gp").textContent=it.a; document.getElementById("tr").textContent=it.en;
    const fb=document.getElementById("fb"); fb.className="fb "+(ok?"ok":"ko"); fb.textContent= ok?"✓ Oui ! · Yes!":"✗ "+it.full;
    mark("b",i,ok,b); setTimeout(()=>play(it.au),350); document.getElementById("nx").classList.add("show"); });
  bindNext("b",D.BULLES.length,"bulles","chat"); };

// ---------- Où est le chat ?
RENDER.chat = () => { const i=S.idx.c, it=D.CHAT[i], r=S.res["c"+i];
  let h=`<div class="card">${head(SC("chat"))}${instr("chat")}${dots("c",D.CHAT.length,i)}
  <div class="jump" id="jp">${scene(it.obj,it.pos)}</div>
  <div class="sent">${esc(it.s).replace("___",`<span class="gap" id="gp">${r?esc(it.a):"…"}</span>`)}</div>
  <div class="choices three">${it.o.map(o=>`<button class="ch big ${r&&o===it.a?"good":""} ${r&&!r.ok&&o===r.c?"bad":""}" data-o="${esc(o)}" ${r?"disabled":""}>${esc(o)}</button>`).join("")}</div>
  <div class="tr en" id="tr">${r?esc(it.en):""}</div>${nextBtn("c",D.CHAT.length)}</div>`;
  const el=document.getElementById("sc-chat"); el.innerHTML=h;
  el.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{ if(S.res["c"+i]) return; const ok=b.dataset.o===it.a; S.res["c"+i]={ok,c:b.dataset.o};
    el.querySelectorAll(".ch").forEach(x=>{ x.disabled=true; if(x.dataset.o===it.a) x.classList.add("good"); }); if(!ok) b.classList.add("bad");
    document.getElementById("gp").textContent=it.a; document.getElementById("tr").textContent=it.en;
    if(ok) document.querySelector("#jp .pet").classList.add("happy");
    mark("c",i,ok,b); setTimeout(()=>play(it.au),300); document.getElementById("nx").classList.add("show"); });
  bindNext("c",D.CHAT.length,"chat","valise"); };

// ---------- Valise magique
RENDER.valise = () => { const i=S.idx.v, it=D.VALISE[i], r=S.res["v"+i], rolled=S.rolled["v"+i]; const opts = i%2 ? [it.ko,it.ok] : [it.ok,it.ko];
  let h=`<div class="card">${head(SC("valise"))}${instr("valise")}${dots("v",D.VALISE.length,i)}
  <div class="diebox"><div class="who show trav"><span class="e1">${it.who}</span><span>${esc(it.name)}</span></div>
  <button class="die suit" id="die" ${rolled?"disabled":""}>🧳</button><div class="en" id="dl">${rolled?"":"Touche la valise ! · Tap the suitcase!"}</div>
  <div class="dest ${rolled?"show":""}" id="dest"><img src="img/${it.img}.jpg" alt=""><span class="trv">${it.who}</span></div></div>
  <div class="choices" id="chs" style="${rolled?"":"display:none"}">${opts.map(o=>`<button class="ch ${r&&o===it.ok?"good":""} ${r&&!r.ok&&o===it.ko?"bad":""}" data-o="${esc(o)}" ${r?"disabled":""}>${esc(o)}</button>`).join("")}</div>
  <div class="tr en" id="tr">${r?esc(it.en):""}</div>${nextBtn("v",D.VALISE.length)}</div>`;
  const el=document.getElementById("sc-valise"); el.innerHTML=h;
  document.getElementById("die").onclick=e=>{ const d=e.currentTarget; d.disabled=true; d.classList.add("fly"); whoosh();
    setTimeout(()=>{ S.rolled["v"+i]=1; save(); document.getElementById("dest").classList.add("show"); document.getElementById("dl").textContent=""; document.getElementById("chs").style.display=""; },900); };
  choiceGame(el,"v",i,it); bindNext("v",D.VALISE.length,"valise","ecoute"); };

// ---------- J'écoute (photos)
RENDER.ecoute = () => { const i=S.idx.e, it=D.ECOUTE[i], r=S.res["e"+i]; const opts = i%2 ? [it.ko,it.ok] : [it.ok,it.ko];
  let h=`<div class="card">${head(SC("ecoute"))}${instr("ecoute")}${dots("e",D.ECOUTE.length,i)}
  <div class="big" style="text-align:center"><button class="play" data-a="${it.au}">🔊</button></div>
  <div class="pics">${opts.map(o=>`<button class="pic ${r&&o===it.ok?"good":""} ${r&&!r.ok&&o===it.ko?"bad":""}" data-o="${o}" ${r?"disabled":""}><img src="img/${o}.jpg" alt=""></button>`).join("")}</div>
  <div class="sent" id="st" style="font-size:30px">${r?esc(it.s):""}</div><div class="tr en" id="tr">${r?esc(it.en):""}</div>${nextBtn("e",D.ECOUTE.length)}</div>`;
  const el=document.getElementById("sc-ecoute"); el.innerHTML=h;
  el.querySelectorAll(".pic").forEach(b=>b.onclick=()=>{ if(S.res["e"+i]) return; const ok=b.dataset.o===it.ok;
    el.querySelectorAll(".pic").forEach(x=>{ x.disabled=true; if(x.dataset.o===it.ok) x.classList.add("good"); }); if(!ok) b.classList.add("bad");
    document.getElementById("st").textContent=it.s; document.getElementById("tr").textContent=it.en; mark("e",i,ok,b); setTimeout(()=>play(it.au),300); document.getElementById("nx").classList.add("show"); });
  bindNext("e",D.ECOUTE.length,"ecoute","pause"); };

// ---------- Pause : Jacques a dit
RENDER.pause = () => { const i=S.idx.j, it=D.JACQUES[i];
  const el=document.getElementById("sc-pause");
  el.innerHTML=`<div class="card jac">${head(SC("pause"))}${instr("pause")}
  <div class="en" style="margin-bottom:8px">« Jacques a dit » = "Simon says". Ne regarde pas l'écran : bouge ! · Don't look at the screen: move!</div>
  <div class="emo">${it.emo}</div>
  <div class="big" style="margin:10px 0"><button class="play" data-a="${it.au}">🔊</button></div>
  <div class="sent" style="font-size:28px">${esc(it.s)}</div><div class="en">${esc(it.en)}</div>
  <button class="next show" id="nx">${i<D.JACQUES.length-1?"Suivant ▶ <span style='font-size:.7em'>Next</span>":"Jeu suivant ▶ <span style='font-size:.7em'>Next game</span>"}</button></div>`;
  document.getElementById("nx").onclick=()=>{ if(S.idx.j<D.JACQUES.length-1){ S.idx.j++; save(); RENDER.pause(); setTimeout(()=>play(D.JACQUES[S.idx.j].au),300); } else { S.idx.j=0; save(); show("cache"); } }; };

// ---------- Où est le ballon ? (écoute + 3 petites scènes)
RENDER.cache = () => { const i=S.idx.h, it=D.CACHE[i], r=S.res["h"+i];
  let h=`<div class="card">${head(SC("cache"))}${instr("cache")}${dots("h",D.CACHE.length,i)}
  <div class="big" style="text-align:center"><button class="play" data-a="${it.au}">🔊</button></div>
  <div class="minis">${it.o.map(p=>`<button class="mini ${r&&p===it.pos?"good":""} ${r&&!r.ok&&p===r.c?"bad":""}" data-o="${p}" ${r?"disabled":""}>${scene(it.obj,p,it.who,true)}</button>`).join("")}</div>
  <div class="sent" id="st" style="font-size:30px">${r?esc(it.s):""}</div><div class="tr en" id="tr">${r?esc(it.en):""}</div>${nextBtn("h",D.CACHE.length)}</div>`;
  const el=document.getElementById("sc-cache"); el.innerHTML=h;
  el.querySelectorAll(".mini").forEach(b=>b.onclick=()=>{ if(S.res["h"+i]) return; const ok=b.dataset.o===it.pos; S.res["h"+i]={ok,c:b.dataset.o};
    el.querySelectorAll(".mini").forEach(x=>{ x.disabled=true; if(x.dataset.o===it.pos) x.classList.add("good"); }); if(!ok) b.classList.add("bad");
    document.getElementById("st").textContent=it.s; document.getElementById("tr").textContent=it.en; mark("h",i,ok,b); setTimeout(()=>play(it.au),300); document.getElementById("nx").classList.add("show"); });
  bindNext("h",D.CACHE.length,"cache","robot"); };

// ---------- Robot
function sandHTML(p){ return p.map((w,k)=>`<span class="${k===1?"bread bl":k===3?"bread br":""}">${esc(w)}</span>`).join(""); }
RENDER.robot = () => { const i=S.idx.r, it=D.ROBOT[i], r=S.res["r"+i]; const opts = i%2 ? [it.ko,it.ok] : [it.ok,it.ko];
  let h=`<div class="card">${head(SC("robot"))}${instr("robot")}${dots("r",D.ROBOT.length,i)}
  <div class="robot"><span class="r">🤖</span><div class="bubble"><button class="play" data-a="${it.rau}" style="width:44px;height:44px;font-size:20px;vertical-align:middle;margin-right:8px">🔊</button>${esc(it.s)}</div></div>
  <div style="text-align:center;margin-top:12px">Le robot dit non… <span class="en">· The robot says no…</span></div>
  <div class="choices">${opts.map(o=>`<button class="ch ${r&&o===it.ok?"good":""} ${r&&!r.ok&&o===it.ko?"bad":""}" data-o="${esc(o)}" ${r?"disabled":""}>🤖 ${esc(o)}</button>`).join("")}</div>
  <div class="sandw" id="sw">${r?sandHTML(it.p):""}</div><div class="tr en" id="tr">${r?esc(it.en):""}</div>${nextBtn("r",D.ROBOT.length)}</div>`;
  const el=document.getElementById("sc-robot"); el.innerHTML=h;
  choiceGame(el,"r",i,it,()=>{ document.getElementById("sw").innerHTML=sandHTML(it.p); });
  bindNext("r",D.ROBOT.length,"robot","roue"); };

// ---------- Roue
RENDER.roue = () => { const i=S.idx.w % D.ROUE.length, it=D.ROUE[i], n=D.ROUE.length; const cols=["#FFC2D6","#9FD3FF","#C9F0C6","#FFE29A","#D9CCFF","#FFCFA8"];
  const grad="conic-gradient("+cols.map((c,k)=>`${c} ${k*360/n}deg ${(k+1)*360/n}deg`).join(",")+")";
  const spans=D.ROUE.map((r,k)=>{ const a=(k+.5)*360/n-90; return `<span style="transform:rotate(${a}deg) translate(80px) rotate(${-a}deg) translate(-50%,-50%)">${r.icon}</span>`; }).join("");
  const el=document.getElementById("sc-roue");
  el.innerHTML=`<div class="card">${head(SC("roue"))}${instr("roue")}
  <div class="wheelw"><div class="pointer">🔻</div><div class="wheel" id="wh" style="background:${grad}">${spans}</div></div>
  <button class="spin" id="spin">Tourne ! <span style="font-size:.7em">Spin!</span></button>
  <div class="rcard" id="rc"><div class="big2">${it.who} ${it.icon}</div><div><b>${esc(it.hint)}</b></div>
   <div style="margin-top:6px">Dis la phrase ! <span class="en">· Say the sentence!</span></div>
   <div style="margin-top:10px"><button class="play" id="lis" data-a="${it.au}">🔊</button></div>
   <div class="ans" id="ans">${esc(it.fr)}<div class="en">${esc(it.en)}</div></div></div>
  <button class="next" id="nx">${(S.idx.w+1)<n?"Encore ! ▶ <span style='font-size:.7em'>Again!</span>":"Mes phrases ▶ <span style='font-size:.7em'>My sentences</span>"}</button></div>`;
  const wh=document.getElementById("wh");
  document.getElementById("spin").onclick=e=>{ e.currentTarget.disabled=true; const target=360*5 + (360 - (i+.5)*360/n); wh.style.transform=`rotate(${target}deg)`; chime(true);
    setTimeout(()=>{ document.getElementById("rc").classList.add("show"); },2700); };
  document.getElementById("lis").addEventListener("click",()=>{ document.getElementById("ans").classList.add("show"); S.said["w"+i]=1; save(); stars(document.getElementById("lis")); document.getElementById("nx").classList.add("show"); });
  document.getElementById("nx").onclick=()=>{ if(S.idx.w+1<n){ S.idx.w++; save(); RENDER.roue(); } else { S.idx.w=0; save(); show("phrases"); } }; };

// ---------- Mes phrases (oral)
RENDER.phrases = () => { const i=S.idx.p, it=D.PHRASES[i], n=D.PHRASES.length, said=S.said["p"+i];
  const el=document.getElementById("sc-phrases");
  el.innerHTML=`<div class="card">${head(SC("phrases"))}${instr("phrases")}
  <div class="dots">${D.PHRASES.map((x,k)=>`<i class="${S.said["p"+k]?"ok":""} ${k===i?"cur":""}"></i>`).join("")}</div>
  <div class="mum"><div class="mic">${it.icon}</div><div class="en2">${esc(it.en)}</div></div>
  <div style="text-align:center;margin:8px 0">Dis-la en français ! <span class="en">· Say it in French!</span></div>
  <div class="big" style="text-align:center"><button class="play" id="lis" data-a="${it.au}">🔊</button></div>
  <div class="ans ${said?"show":""}" id="ans" style="text-align:center">${esc(it.fr)}</div>
  <button class="next ${said?"show":""}" id="nx">${i<n-1?"Suivant ▶ <span style='font-size:.7em'>Next</span>":"À revoir ▶ <span style='font-size:.7em'>To review</span>"}</button></div>`;
  document.getElementById("lis").addEventListener("click",()=>{ document.getElementById("ans").classList.add("show"); if(!S.said["p"+i]) stars(document.getElementById("lis")); S.said["p"+i]=1; save(); document.getElementById("nx").classList.add("show"); });
  document.getElementById("nx").onclick=()=>{ if(S.idx.p<n-1){ S.idx.p++; save(); RENDER.phrases(); } else show("revoir"); }; };

// ---------- À revoir
RENDER.revoir = () => { const W=[]; const add=(p,arr,f)=>arr.forEach((it,k)=>{ const r=S.res[p+k]; if(r && !r.ok) W.push(f(it)); });
  add("b",D.BULLES,it=>({q:it.s,a:it.full,r:it.r})); add("c",D.CHAT,it=>({q:"🐈 "+it.s,a:it.full,r:"r-prep"}));
  add("v",D.VALISE,it=>({q:it.who+" "+it.name,a:it.ok,r:it.r})); add("e",D.ECOUTE,it=>({q:"🔊",a:it.s,r:it.r}));
  add("h",D.CACHE,it=>({q:"🔊",a:it.s,r:"r-prep"})); add("r",D.ROBOT,it=>({q:it.s,a:it.ok,r:"r-sandwich"}));
  const names={}; D.RULES.forEach(r=>names[r.id]=r.t);
  const answered=Object.keys(S.res).length;
  document.getElementById("sc-revoir").innerHTML=`<div class="card">${head(SC("revoir"))}
  <p style="margin:0 0 10px">Evelyn, voici les phrases à revoir. Touche pour relire la règle. <span class="en">· Evelyn, here are the sentences to review. Tap to read the rule again.</span></p>
  ${W.length? W.map(w=>`<div class="rv"><div>${esc(w.q)}</div><div class="a">→ ${esc(w.a)}</div><button data-rule="${w.r}">↑ ${esc(names[w.r])}</button></div>`).join("") : `<p class="en">${answered? "Rien à revoir ! Bravo ! · Nothing to review! Well done!" : "Joue d'abord aux jeux. · Play the games first."}</p>`}
  <button class="reset" id="rs">↺ Recommencer · Start again</button></div>`;
  document.querySelectorAll("#sc-revoir [data-rule]").forEach(b=>b.onclick=()=>goRule(b.dataset.rule));
  document.getElementById("rs").onclick=e=>{ const b=e.currentTarget; if(b.dataset.sure){ localStorage.removeItem(KEY); location.reload(); } else { b.dataset.sure=1; b.textContent="Sûre ? Touche encore · Sure? Tap again"; } }; };
function goRule(id){ show("rappel"); setTimeout(()=>{ const e=document.getElementById(id); if(!e) return; e.scrollIntoView({behavior:"smooth",block:"center"}); e.classList.remove("flash"); void e.offsetWidth; e.classList.add("flash"); },150); }
// ---------- events
document.addEventListener("click",e=>{ const p=e.target.closest(".play, .play2"); if(p && p.dataset.a) play(p.dataset.a); const n=e.target.closest("nav button"); if(n) show(n.dataset.s); });
refresh(); show(S.screen || "rappel"); window.__ready=1;

</script>
<div class="fai-sign" style="text-align:center;padding:26px 16px 30px;clear:both"><img src="../marque/signature-irene.png" alt="Le français avec Irène · Cours de français en ligne" style="width:100%;max-width:300px;height:auto;display:inline-block"></div></body>
</html>
