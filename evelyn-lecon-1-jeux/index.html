let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
if (!S) S = {res:{}, idx:{b:0,d:0,r:0,e:0,j:0,w:0}, rolled:{}, said:{}, screen:"rappel"};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let cur = null;
function play(k){ if(!k) return; try { if (cur) cur.pause(); cur = new Audio("audio/"+k+".mp3"); cur.play().catch(()=>{}); } catch(e){} }
let actx=null;
function chime(good){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  (good?[659,880,1175,1568]:[330,262]).forEach((f,i)=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type=good?"sine":"triangle"; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime+i*(good?.08:.14); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(good?.12:.07,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.35); o.start(t); o.stop(t+.4); }); }catch(e){} }
function stars(el){ const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; const sym=["⭐","✨","🌟","💖","⭐","✨","🌈","⭐","✨","🌟"];
  sym.forEach((s,i)=>{ const e=document.createElement("span"); e.className="star"; e.textContent=s; const a=Math.PI*2*i/sym.length, d=70+Math.random()*60;
  e.style.left=cx+"px"; e.style.top=cy+"px"; e.style.setProperty("--dx",Math.cos(a)*d+"px"); e.style.setProperty("--dy",Math.sin(a)*d-20+"px"); e.style.animationDelay=(i*25)+"ms"; document.body.appendChild(e); setTimeout(()=>e.remove(),1200); });
  const sc=document.getElementById("score"); sc.classList.add("bump"); setTimeout(()=>sc.classList.remove("bump"),250); }

const SCREENS = [
 {id:"rappel", ic:"📖", t:"Rappel", en:"Reminder"},
 {id:"bulles", ic:"🫧", t:"Les bulles", en:"Bubbles", n:D.BULLES.length, p:"b"},
 {id:"de", ic:"🎲", t:"Le dé", en:"The die", n:D.DE.length, p:"d"},
 {id:"robot", ic:"🤖", t:"Le robot", en:"The robot", n:D.ROBOT.length, p:"r"},
 {id:"ecoute", ic:"👂", t:"J'écoute", en:"I listen", n:D.ECOUTE.length, p:"e"},
 {id:"pause", ic:"🌙", t:"Pause", en:"Move!"},
 {id:"roue", ic:"🎡", t:"La roue", en:"The wheel"},
 {id:"revoir", ic:"🔁", t:"À revoir", en:"To review"},
];
const TOTAL = D.BULLES.length + D.DE.length + D.ROBOT.length + D.ECOUTE.length;
document.getElementById("tot").textContent = TOTAL;
document.getElementById("nav").innerHTML = SCREENS.map(s=>`<button data-s="${s.id}">${s.ic} ${s.t}<small>${s.en}</small></button>`).join("");
document.getElementById("screens").innerHTML = SCREENS.map(s=>`<section class="screen" id="sc-${s.id}"></section>`).join("");
function instr(k){ return `<div class="instr"><button class="play" data-a="${D.INS[k]}">🔊</button><div>${esc(D.INSTR[k])}<div class="en">${esc(EN_INSTR[k])}</div></div></div>`; }
const EN_INSTR = {i1:"Evelyn, read the sentence and tap the right bubble.",i2:"Evelyn, roll the die, then choose the right sentence.",i3:"Evelyn, the robot always says no. Choose its sentence.",i4:"Evelyn, listen and tap the right picture.",i5:"Evelyn, stand up! Listen to Jacques and do as he says.",i6:"Evelyn, spin the wheel and say the sentence. Then listen."};
function head(s){ return `<div class="shead"><span class="ic">${s.ic}</span><div><h2>${s.t}</h2><div class="en">${s.en}</div></div></div>`; }
function dots(p,n,i){ let h='<div class="dots">'; for(let k=0;k<n;k++){ const r=S.res[p+k]; h+=`<i class="${r?(r.ok?"ok":"ko"):""} ${k===i?"cur":""}"></i>`; } return h+"</div>"; }
function show(id){ S.screen=id; save(); document.querySelectorAll(".screen").forEach(e=>e.classList.toggle("on", e.id==="sc-"+id)); document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.s===id)); RENDER[id](); if(window.__ready) document.getElementById("nav").scrollIntoView({behavior:"smooth"}); }
function mark(p, i, ok, el){ S.res[p+i]={ok}; save(); if(ok){ chime(true); stars(el); } else chime(false); refresh(); }
function refresh(){ let n=0; Object.values(S.res).forEach(r=>{ if(r.ok) n++; }); document.getElementById("sc").textContent=n;
  SCREENS.forEach(s=>{ if(!s.p) return; let all=true; for(let k=0;k<s.n;k++) if(!S.res[s.p+k]) all=false; const b=document.querySelector(`nav button[data-s="${s.id}"]`); b.classList.toggle("done", all); }); }
function nextBtn(p, n, scr){ const i=S.idx[p]; return i < n-1 ? `<button class="next" id="nx">Suivant ▶ <span style="font-size:.7em">Next</span></button>` : `<button class="next" id="nx">Jeu suivant ▶ <span style="font-size:.7em">Next game</span></button>`; }
function bindNext(p, n, scr, nextScr){ const b=document.getElementById("nx"); if(!b) return; if(S.res[p+S.idx[p]]) b.classList.add("show");
  b.onclick=()=>{ if(S.idx[p]<n-1){ S.idx[p]++; save(); RENDER[scr](); } else show(nextScr); }; }
const RENDER = {};
// ---------- Rappel
RENDER.rappel = () => { const cols={"r-etre":"#4C9BE8","r-emotions":"#E8618C","r-fille":"#7C6BE0","r-sandwich":"#21A99A"};
  document.getElementById("sc-rappel").innerHTML = `<div class="card">${head(SCREENS[0])}<p style="margin:0 0 14px">Evelyn, écoute la règle, puis joue ! <span class="en">· Evelyn, listen to the rule, then play!</span></p>` +
  D.RULES.map(r=>`<div class="rule" id="${r.id}" style="--c:${cols[r.id]}"><h3>${esc(r.t)} <span class="en">· ${esc(r.en)}</span></h3>${r.lines.map((l,i)=>`<div class="rl"><button class="play" data-a="${r.au[i]}">🔊</button><div>${esc(l[0])}<span class="en">${esc(l[1])}</span></div></div>`).join("")}</div>`).join("") +
  `<button class="next show" onclick="show('bulles')">On joue ! ▶ <span style="font-size:.7em">Let's play!</span></button></div>`; };
// ---------- Bulles
RENDER.bulles = () => { const i=S.idx.b, it=D.BULLES[i], r=S.res["b"+i]; const colors=["#9FD3FF","#FFC2D6","#C9F0C6"];
  const pos=[[8,90],[38,30],[68,100]];
  let h=`<div class="card">${head(SCREENS[1])}${instr("i1")}${dots("b",D.BULLES.length,i)}
  <div class="sent">${esc(it.s).replace("___",`<span class="gap" id="gp">${r? esc(it.a):"…"}</span>`)}</div><div class="tr en" id="tr">${r?esc(it.en):""}</div>
  <div class="sky"><span class="cloud" style="top:10px">☁️</span><span class="cloud" style="top:150px;animation-delay:-11s;font-size:44px">☁️</span>`;
  it.o.forEach((o,k)=>{ h+=`<button class="bub ${r&&o===it.a?"glow":""} ${r&&!r.ok&&o===r.c?"bad":""}" data-o="${esc(o)}" style="left:${pos[k][0]}%;top:${pos[k][1]}px;--bc:${colors[k]};--d:${3+k*.7}s;animation-delay:-${k}s" ${r?"disabled":""}>${esc(o)}</button>`; });
  h+=`</div><div class="fb ${r?(r.ok?"ok":"ko"):""}" id="fb">${r?(r.ok?"✓ Oui ! · Yes!":"✗ "+esc(it.full)):""}</div>${nextBtn("b",D.BULLES.length)}</div>`;
  const el=document.getElementById("sc-bulles"); el.innerHTML=h;
  el.querySelectorAll(".bub").forEach(b=>b.onclick=()=>{ if(S.res["b"+i]) return; const ok=b.dataset.o===it.a; S.res["b"+i]={ok,c:b.dataset.o};
    el.querySelectorAll(".bub").forEach(x=>x.disabled=true);
    if(ok){ b.classList.add("popit"); } else { b.classList.add("bad"); el.querySelector(`.bub[data-o="${it.a}"]`).classList.add("glow"); }
    document.getElementById("gp").textContent=it.a; document.getElementById("tr").textContent=it.en;
    const fb=document.getElementById("fb"); fb.className="fb "+(ok?"ok":"ko"); fb.textContent= ok?"✓ Oui ! · Yes!":"✗ "+it.full;
    mark("b",i,ok,b); setTimeout(()=>play(it.au),350); document.getElementById("nx").classList.add("show"); });
  bindNext("b",D.BULLES.length,"bulles","de"); };
// ---------- Dé
RENDER.de = () => { const i=S.idx.d, it=D.DE[i], r=S.res["d"+i], rolled=S.rolled["d"+i]; const opts = i%2 ? [it.ko,it.ok] : [it.ok,it.ko];
  let h=`<div class="card">${head(SCREENS[2])}${instr("i2")}${dots("d",D.DE.length,i)}
  <div class="diebox"><button class="die" id="die" ${rolled?"disabled":""}>🎲</button><div class="en" id="dl">${rolled?"":"Touche le dé ! · Tap the die!"}</div>
  <div class="who ${rolled?"show":""}" id="who"><span class="e1">${it.who}</span><span>${esc(it.name)}</span><span class="e2">${it.emo}</span></div></div>
  <div class="choices" id="chs" style="${rolled?"":"display:none"}">${opts.map(o=>`<button class="ch ${r&&o===it.ok?"good":""} ${r&&!r.ok&&o===it.ko?"bad":""}" data-o="${esc(o)}" ${r?"disabled":""}>${esc(o)}</button>`).join("")}</div>
  <div class="tr en" id="tr">${r?esc(it.en):""}</div>${nextBtn("d",D.DE.length)}</div>`;
  const el=document.getElementById("sc-de"); el.innerHTML=h;
  document.getElementById("die").onclick=e=>{ const d=e.currentTarget; d.disabled=true; d.classList.add("roll"); chime(true);
    setTimeout(()=>{ S.rolled["d"+i]=1; save(); document.getElementById("who").classList.add("show"); document.getElementById("dl").textContent=""; document.getElementById("chs").style.display=""; },1000); };
  el.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{ if(S.res["d"+i]) return; const ok=b.dataset.o===it.ok;
    el.querySelectorAll(".ch").forEach(x=>{ x.disabled=true; if(x.dataset.o===it.ok) x.classList.add("good"); }); if(!ok) b.classList.add("bad");
    document.getElementById("tr").textContent=it.en; mark("d",i,ok,b); play(it.au); document.getElementById("nx").classList.add("show"); });
  bindNext("d",D.DE.length,"de","robot"); };
// ---------- Robot
function sandHTML(p){ return p.map((w,k)=>`<span class="${k===1?"bread bl":k===3?"bread br":""}">${esc(w)}</span>`).join(""); }
RENDER.robot = () => { const i=S.idx.r, it=D.ROBOT[i], r=S.res["r"+i]; const opts = i%2 ? [it.ko,it.ok] : [it.ok,it.ko];
  let h=`<div class="card">${head(SCREENS[3])}${instr("i3")}${dots("r",D.ROBOT.length,i)}
  <div class="robot"><span class="r">🤖</span><div class="bubble"><button class="play" data-a="${it.rau}" style="width:44px;height:44px;font-size:20px;vertical-align:middle;margin-right:8px">🔊</button>${esc(it.s)}</div></div>
  ${it.w?`<div class="en" style="text-align:center;margin-top:6px">${esc(it.w)}</div>`:""}
  <div style="text-align:center;margin-top:12px">Le robot dit non… <span class="en">· The robot says no…</span></div>
  <div class="choices">${opts.map(o=>`<button class="ch ${r&&o===it.ok?"good":""} ${r&&!r.ok&&o===it.ko?"bad":""}" data-o="${esc(o)}" ${r?"disabled":""}>🤖 ${esc(o)}</button>`).join("")}</div>
  <div class="sandw" id="sw">${r?sandHTML(it.p):""}</div><div class="tr en" id="tr">${r?esc(it.en):""}</div>${nextBtn("r",D.ROBOT.length)}</div>`;
  const el=document.getElementById("sc-robot"); el.innerHTML=h;
  el.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{ if(S.res["r"+i]) return; const ok=b.dataset.o===it.ok;
    el.querySelectorAll(".ch").forEach(x=>{ x.disabled=true; if(x.dataset.o===it.ok) x.classList.add("good"); }); if(!ok) b.classList.add("bad");
    document.getElementById("sw").innerHTML=sandHTML(it.p); document.getElementById("tr").textContent=it.en; mark("r",i,ok,b); play(it.au); document.getElementById("nx").classList.add("show"); });
  bindNext("r",D.ROBOT.length,"robot","ecoute"); };
// ---------- Écoute
RENDER.ecoute = () => { const i=S.idx.e, it=D.ECOUTE[i], r=S.res["e"+i]; const opts = i%2 ? [it.ko,it.ok] : [it.ok,it.ko];
  let h=`<div class="card">${head(SCREENS[4])}${instr("i4")}${dots("e",D.ECOUTE.length,i)}
  <div class="big" style="text-align:center"><button class="play" data-a="${it.au}">🔊</button></div>
  <div class="pics">${opts.map(o=>`<button class="pic ${r&&o===it.ok?"good":""} ${r&&!r.ok&&o===it.ko?"bad":""}" data-o="${o}" ${r?"disabled":""}><img src="img/${o}.jpg" alt=""></button>`).join("")}</div>
  <div class="sent" id="st" style="font-size:30px">${r?esc(it.s):""}</div><div class="tr en" id="tr">${r?esc(it.en):""}</div>${nextBtn("e",D.ECOUTE.length)}</div>`;
  const el=document.getElementById("sc-ecoute"); el.innerHTML=h;
  el.querySelectorAll(".pic").forEach(b=>b.onclick=()=>{ if(S.res["e"+i]) return; const ok=b.dataset.o===it.ok;
    el.querySelectorAll(".pic").forEach(x=>{ x.disabled=true; if(x.dataset.o===it.ok) x.classList.add("good"); }); if(!ok) b.classList.add("bad");
    document.getElementById("st").textContent=it.s; document.getElementById("tr").textContent=it.en; mark("e",i,ok,b); setTimeout(()=>play(it.au),300); document.getElementById("nx").classList.add("show"); });
  bindNext("e",D.ECOUTE.length,"ecoute","pause"); };
// ---------- Pause : Jacques a dit
RENDER.pause = () => { const i=S.idx.j, it=D.JACQUES[i];
  const el=document.getElementById("sc-pause");
  el.innerHTML=`<div class="card jac">${head(SCREENS[5])}${instr("i5")}
  <div class="en" style="margin-bottom:8px">« Jacques a dit » = "Simon says". Ne regarde pas l'écran : bouge ! · Don't look at the screen: move!</div>
  <div class="emo">${it.emo}</div>
  <div class="big" style="margin:10px 0"><button class="play" data-a="${it.au}">🔊</button></div>
  <div class="sent" style="font-size:28px">${esc(it.s)}</div><div class="en">${esc(it.en)}</div>
  <button class="next show" id="nx">${i<D.JACQUES.length-1?"Suivant ▶ <span style='font-size:.7em'>Next</span>":"Jeu suivant ▶ <span style='font-size:.7em'>Next game</span>"}</button></div>`;
  document.getElementById("nx").onclick=()=>{ if(S.idx.j<D.JACQUES.length-1){ S.idx.j++; save(); RENDER.pause(); setTimeout(()=>play(D.JACQUES[S.idx.j].au),300); } else { S.idx.j=0; save(); show("roue"); } }; };
// ---------- Roue
RENDER.roue = () => { const i=S.idx.w % D.ROUE.length, it=D.ROUE[i], n=D.ROUE.length; const cols=["#FFC2D6","#9FD3FF","#C9F0C6","#FFE29A","#D9CCFF","#FFCFA8"];
  const grad="conic-gradient("+cols.map((c,k)=>`${c} ${k*360/n}deg ${(k+1)*360/n}deg`).join(",")+")";
  const spans=D.ROUE.map((r,k)=>{ const a=(k+.5)*360/n-90; return `<span style="transform:rotate(${a}deg) translate(80px) rotate(${-a}deg) translate(-50%,-50%)">${r.emo}</span>`; }).join("");
  const said=S.said["w"+i];
  const el=document.getElementById("sc-roue");
  el.innerHTML=`<div class="card">${head(SCREENS[6])}${instr("i6")}
  <div class="wheelw"><div class="pointer">🔻</div><div class="wheel" id="wh" style="background:${grad}">${spans}</div></div>
  <button class="spin" id="spin">Tourne ! <span style="font-size:.7em">Spin!</span></button>
  <div class="rcard" id="rc"><div class="big2">${it.who.split(" ")[0]} ${it.neg?'<span class="no">✖</span>':""}${it.emo}</div>
   <div><b>${esc(it.who.split(" ").slice(1).join(" "))}</b> ${it.neg?"· ne … pas":""}</div>
   <div style="margin-top:6px">Dis la phrase ! <span class="en">· Say the sentence!</span></div>
   <div style="margin-top:10px"><button class="play" id="lis" data-a="${it.au}">🔊</button></div>
   <div class="ans" id="ans">${esc(it.fr)}<div class="en">${esc(it.en)}</div></div></div>
  <button class="next" id="nx">${(S.idx.w+1)<n?"Encore ! ▶ <span style='font-size:.7em'>Again!</span>":"À revoir ▶ <span style='font-size:.7em'>To review</span>"}</button></div>`;
  const wh=document.getElementById("wh");
  document.getElementById("spin").onclick=e=>{ e.currentTarget.disabled=true; const target=360*5 + (360 - (i+.5)*360/n); wh.style.transform=`rotate(${target}deg)`; chime(true);
    setTimeout(()=>{ document.getElementById("rc").classList.add("show"); },2700); };
  document.getElementById("lis").addEventListener("click",()=>{ document.getElementById("ans").classList.add("show"); S.said["w"+i]=1; save(); stars(document.getElementById("lis")); document.getElementById("nx").classList.add("show"); });
  document.getElementById("nx").onclick=()=>{ if(S.idx.w+1<n){ S.idx.w++; save(); RENDER.roue(); } else { S.idx.w=0; save(); show("revoir"); } }; };
// ---------- À revoir
RENDER.revoir = () => { const W=[]; const add=(p,arr,f)=>arr.forEach((it,k)=>{ const r=S.res[p+k]; if(r && !r.ok) W.push(f(it)); });
  add("b",D.BULLES,it=>({q:it.s,a:it.full,r:it.r})); add("d",D.DE,it=>({q:it.name+" "+it.emo,a:it.ok,r:it.r}));
  add("r",D.ROBOT,it=>({q:it.s,a:it.ok,r:"r-sandwich"})); add("e",D.ECOUTE,it=>({q:"🔊",a:it.s,r:it.r}));
  const names={}; D.RULES.forEach(r=>names[r.id]=r.t);
  const answered=Object.keys(S.res).length;
  document.getElementById("sc-revoir").innerHTML=`<div class="card">${head(SCREENS[7])}
  <p style="margin:0 0 10px">Evelyn, voici les phrases à revoir. Touche pour relire la règle. <span class="en">· Evelyn, here are the sentences to review. Tap to read the rule again.</span></p>
  ${W.length? W.map(w=>`<div class="rv"><div>${esc(w.q)}</div><div class="a">→ ${esc(w.a)}</div><button data-rule="${w.r}">↑ ${esc(names[w.r])}</button></div>`).join("") : `<p class="en">${answered? "Rien à revoir ! · Nothing to review!" : "Joue d'abord aux jeux. · Play the games first."}</p>`}
  <button class="reset" id="rs">↺ Recommencer · Start again</button></div>`;
  document.querySelectorAll("#sc-revoir [data-rule]").forEach(b=>b.onclick=()=>goRule(b.dataset.rule));
  document.getElementById("rs").onclick=e=>{ const b=e.currentTarget; if(b.dataset.sure){ localStorage.removeItem(KEY); location.reload(); } else { b.dataset.sure=1; b.textContent="Sûre ? Touche encore · Sure? Tap again"; } }; };
function goRule(id){ show("rappel"); setTimeout(()=>{ const e=document.getElementById(id); if(!e) return; e.scrollIntoView({behavior:"smooth",block:"center"}); e.classList.remove("flash"); void e.offsetWidth; e.classList.add("flash"); },150); }
// ---------- events
document.addEventListener("click",e=>{ const p=e.target.closest(".play"); if(p && p.dataset.a) play(p.dataset.a); const n=e.target.closest("nav button"); if(n) show(n.dataset.s); });
refresh(); show(S.screen || "rappel"); window.__ready=1;
</script>
</body>
